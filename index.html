                const inp = "w-full px-4 py-3 border-2 rounded-xl focus:border-purple-500 outline-none";
                const btnP = "flex-1 bg-gray-200 hover:bg-gray-300 px-6 py-3 rounded-xl font-bold";
                const btnN = `flex-1 ${t.btn} text-white px-6 py-3 rounded-xl font-bold`;

                return (
                    <div className={bg}>
                        {/* PASO 1: Bienvenida */}
                        {paso === 1 && (
                            <div className={`${card} text-center`}>
                                <Progreso />
                                <div className="text-6xl mb-4">💰</div>
                                <h1 className="text-3xl font-bold text-gray-800 mb-3">¡Bienvenido a Finanzas App!</h1>
                                <p className="text-gray-600 mb-6">Te ayudaremos a gestionar tus gastos de forma inteligente. El tutorial dura solo 2 minutos.</p>
                                <div className="mb-4 text-left">
                                    <label className="block text-gray-700 font-bold mb-2">¿Cómo te llamas? (opcional)</label>
                                    <input type="text" value={datos.nombre}
                                        onChange={(e) => setDatos({...datos, nombre: e.target.value})}
                                        placeholder="Tu nombre"
                                        className={inp} />
                                </div>
                                <div className="mb-6 text-left">
                                    <label className="block text-gray-700 font-bold mb-2">Idioma preferido</label>
                                    <select value={datos.idioma}
                                        onChange={(e) => setDatos({...datos, idioma: e.target.value})}
                                        className={inp}>
                                        <option value="es-MX">Español (México)</option>
                                        <option value="es-AR">Español (Argentina)</option>
                                        <option value="en">English</option>
                                    </select>
                                </div>
                                <button onClick={() => setPaso(2)}
                                    className={`w-full bg-gradient-to-r ${t.btnGrad} text-white px-6 py-4 rounded-xl font-bold text-lg`}>
                                    Comenzar →
                                </button>
                            </div>
                        )}

                        {/* PASO 2: Configurá tus Monedas */}
                        {paso === 2 && (() => {
                            const MONEDAS_LISTA = [
                                { code: 'MXN', label: 'MXN - Peso Mexicano 🇲🇽' },
                                { code: 'USD', label: 'USD - Dólar Estadounidense 💲' },
                                { code: 'ARS', label: 'ARS - Peso Argentino 🇦🇷' },
                                { code: 'EUR', label: 'EUR - Euro 🇪🇺' },
                                { code: 'GBP', label: 'GBP - Libra Esterlina 🇬🇧' },
                                { code: 'BRL', label: 'BRL - Real Brasileño 🇧🇷' },
                                { code: 'COP', label: 'COP - Peso Colombiano 🇨🇴' },
                                { code: 'CLP', label: 'CLP - Peso Chileno 🇨🇱' },
                                { code: 'PEN', label: 'PEN - Sol Peruano 🇵🇪' },
                            ];
                            const LIMITE_SECUNDARIAS = estado.isPremium ? 999 : 2;
                            const secundariasActuales = datos.monedasSecundarias || [];
                            const toggleSecundaria = (code) => {
                                if (secundariasActuales.includes(code)) {
                                    setDatos({...datos, monedasSecundarias: secundariasActuales.filter(c => c !== code)});
                                } else if (secundariasActuales.length < LIMITE_SECUNDARIAS) {
                                    setDatos({...datos, monedasSecundarias: [...secundariasActuales, code]});
                                }
                            };
                            return (
                                <div className={card}>
                                    <Progreso />
                                    <h2 className="text-2xl font-bold text-gray-800 mb-2">💱 Configurá tus Monedas</h2>
                                    <p className="text-gray-600 mb-5">¿Con qué monedas trabajás?</p>
                                    <div className="space-y-5 mb-6">
                                        <div>
                                            <label className="block text-gray-700 font-bold mb-2">¿Cuál es tu moneda principal?</label>
                                            <select value={datos.monedaPrincipal}
                                                onChange={(e) => {
                                                    const nueva = e.target.value;
                                                    setDatos({...datos,
                                                        monedaPrincipal: nueva,
                                                        monedasSecundarias: secundariasActuales.filter(c => c !== nueva),
                                                    });
                                                }}
                                                className={inp}>
                                                {MONEDAS_LISTA.map(m => <option key={m.code} value={m.code}>{m.label}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-gray-700 font-bold mb-2">¿Usás otras monedas?</label>
                                            {!estado.isPremium && (
                                                <p className="text-xs text-gray-500 mb-3">Versión Basic: hasta 2 monedas secundarias.</p>
                                            )}
                                            <div className="space-y-2">
                                                {MONEDAS_LISTA.filter(m => m.code !== datos.monedaPrincipal).map(m => {
                                                    const seleccionada = secundariasActuales.includes(m.code);
                                                    const limiteAlcanzado = !seleccionada && secundariasActuales.length >= LIMITE_SECUNDARIAS;
                                                    return (
                                                        <label key={m.code} className={`flex items-center gap-3 p-3 rounded-xl border-2 cursor-pointer transition-all ${seleccionada ? 'border-purple-400 bg-purple-50' : 'border-gray-200 hover:border-gray-300'} ${limiteAlcanzado ? 'opacity-50 cursor-not-allowed' : ''}`}>
                                                            <input type="checkbox"
                                                                checked={seleccionada}
                                                                disabled={limiteAlcanzado}
                                                                onChange={() => toggleSecundaria(m.code)}
                                                                className="w-4 h-4 accent-purple-600" />
                                                            <span className="font-medium text-gray-800">{m.label}</span>
                                                        </label>
                                                    );
                                                })}
                                            </div>
                                            {!estado.isPremium && secundariasActuales.length >= LIMITE_SECUNDARIAS && (
                                                <div className="mt-3 bg-amber-50 border border-amber-200 rounded-xl p-3 text-sm text-amber-800">
                                                    🔒 Versión Basic permite hasta 2 monedas secundarias. Activá Premium para ilimitadas.
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                    <div className="flex gap-3">
                                        <button onClick={() => setPaso(1)} className={btnP}>← Atrás</button>
                                        <button onClick={() => setPaso(3)} className={btnN}>Siguiente →</button>
                                    </div>
                                </div>
                            );
                        })()}

                        {/* PASO 3: Tipos de Cambio */}
                        {paso === 3 && (() => {
                            const principal = datos.monedaPrincipal;
                            const secundarias = datos.monedasSecundarias || [];
                            const tcActuales = datos.tiposCambio || {};
                            const getTC = (code) => tcActuales[code] || { direccion: `${code}_TO_${principal}`, valor: '' };
                            const updateTC = (code, field, value) => {
                                setDatos({...datos, tiposCambio: {
                                    ...tcActuales,
                                    [code]: { ...getTC(code), [field]: value }
                                }});
                            };
                            return (
                                <div className={card}>
                                    <Progreso />
                                    <h2 className="text-2xl font-bold text-gray-800 mb-2">💹 Tipos de Cambio</h2>
                                    <p className="text-gray-600 mb-5">
                                        {secundarias.length > 0
                                            ? `Define cómo se convierten tus monedas respecto a ${principal}`
                                            : 'No seleccionaste monedas secundarias.'}
                                    </p>
                                    {secundarias.length > 0 && (
                                        <div className="space-y-4 mb-6">
                                            {secundarias.map(code => {
                                                const tc = getTC(code);
                                                const isSecToPrin = tc.direccion === `${code}_TO_${principal}`;
                                                return (
                                                    <div key={code} className="border-2 border-gray-200 rounded-xl p-4">
                                                        <p className="font-bold text-gray-800 mb-3">{code}</p>
                                                        <div className="space-y-2 mb-3">
                                                            <label className="flex items-center gap-2 cursor-pointer">
                                                                <input type="radio" checked={isSecToPrin}
                                                                    onChange={() => updateTC(code, 'direccion', `${code}_TO_${principal}`)}
                                                                    className="accent-purple-600" />
                                                                <span className="text-sm text-gray-700">1 {code} = ___ {principal}</span>
                                                            </label>
                                                            <label className="flex items-center gap-2 cursor-pointer">
                                                                <input type="radio" checked={!isSecToPrin}
                                                                    onChange={() => updateTC(code, 'direccion', `${principal}_TO_${code}`)}
                                                                    className="accent-purple-600" />
                                                                <span className="text-sm text-gray-700">1 {principal} = ___ {code}</span>
                                                            </label>
                                                        </div>
                                                        <input type="number" step="any"
                                                            value={tc.valor}
                                                            onChange={(e) => updateTC(code, 'valor', e.target.value)}
                                                            placeholder={isSecToPrin ? `1 ${code} = ? ${principal}` : `1 ${principal} = ? ${code}`}
                                                            className={inp} />
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                    <div className="flex gap-3">
                                        <button onClick={() => setPaso(2)} className={btnP}>← Atrás</button>
                                        <button onClick={() => setPaso(4)} className={btnN}>Siguiente →</button>
                                    </div>
                                </div>
                            );
                        })()}

                        {/* PASO 4: Información Básica */}
                        {paso === 4 && (
                            <div className={card}>
                                <Progreso />
                                <h2 className="text-2xl font-bold text-gray-800 mb-2">📅 Información Básica</h2>
                                <p className="text-gray-600 mb-5">¿Desde cuándo querés empezar a contar?</p>
                                <div className="mb-6">
                                    <label className="block text-gray-700 font-bold mb-2">📅 Fecha de inicio</label>
                                    <input type="date" value={datos.fechaInicio}
                                        onChange={(e) => setDatos({...datos, fechaInicio: e.target.value})}
                                        className={inp} required />
                                    <p className="text-xs text-gray-500 mt-1">A partir de esta fecha se calcula el ciclo de tus gastos fijos.</p>
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={() => setPaso(3)} className={btnP}>← Atrás</button>
                                    <button onClick={() => {
                                        if (!datos.fechaInicio) { alert('Por favor ingresa una fecha de inicio'); return; }
                                        setPaso(5);
                                    }} className={btnN}>Siguiente →</button>
                                </div>
                            </div>
                        )}

                        {/* PASO 5: Tu Billetera (OBLIGATORIO) */}
                        {paso === 5 && (() => {
                            const currencyEmojis = { MXN: '🇲🇽', USD: '💵', ARS: '🇦🇷', EUR: '🇪🇺', GBP: '🇬🇧', CAD: '🍁', COP: '🇨🇴', BRL: '🇧🇷', CLP: '🇨🇱' };
                            const currencyKeys = { MXN: 'mxnFisico', USD: 'usd', ARS: 'ars' };
                            const principal = datos.monedaPrincipal || 'MXN';
                            const secundarias = datos.monedasSecundarias || [];
                            const todasMonedas = [principal, ...secundarias];
                            const getKey = (code) => currencyKeys[code] || code.toLowerCase();
                            return (
                                <div className={card}>
                                    <Progreso />
                                    <h2 className="text-2xl font-bold text-gray-800 mb-2">💰 Tu Billetera</h2>

                                        {todasMonedas.map(code => (
                                            <div key={code}>
                                                <label className="block text-gray-700 font-semibold mb-1">
                                                    {currencyEmojis[code] || '💱'} {code}

                                                    value={datos[getKey(code)] || '0'}
                                                    onChange={(e) => setDatos({...datos, [getKey(code)]: e.target.value})}
                                                    placeholder="0" className={inp} />

                                </div>

                    {/* Modal: Nueva Sección Billetera */}
                    {modal === 'nuevaSeccion' && (
                        <Modal onClose={() => setModal(null)}>
                            <h2 className="text-2xl font-bold mb-4">➕ Nueva sección</h2>
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                const f = e.target;
                                const secciones = estado.billetera.secciones || [];
                                const maxId = secciones.length > 0 ? Math.max(...secciones.map(s => s.id)) : 0;
                                const nuevaSeccion = {
                                    id: maxId + 1,
                                    nombre: f.nombre.value,
                                    monto: parseFloat(f.monto.value) || 0,
                                    icono: f.icono.value || '💼'
                                };
                                setEstado({...estado, billetera: {...estado.billetera, secciones: [...secciones, nuevaSeccion]}});
                                setModal(null);
                            }}>
                                <div className="space-y-3 mb-4">
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">Icono (emoji)</label>
                                        <input type="text" name="icono" placeholder="💼" className="w-full px-4 py-3 border-2 rounded-xl text-2xl text-center" maxLength="4" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">Nombre</label>
                                        <input type="text" name="nombre" required placeholder="Ej: Ahorros, Cuenta digital" className="w-full px-4 py-3 border-2 rounded-xl" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">Monto inicial</label>
                                        <input type="number" name="monto" step="0.01" placeholder="0" className="w-full px-4 py-3 border-2 rounded-xl text-2xl" />
                                    </div>
                                </div>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setModal(null)} className="flex-1 bg-gray-200 hover:bg-gray-300 px-6 py-3 rounded-xl font-bold">Cancelar</button>
                                    <button type="submit" className={`flex-1 ${t.btn} text-white px-6 py-3 rounded-xl font-bold`}>Crear</button>
                                </div>
                            </form>
                        </Modal>
                    )}

                    {/* Modal: Editar Sección Billetera */}
                    {modal === 'editarSeccion' && (
                        <Modal onClose={() => setModal(null)}>
                            <h2 className="text-2xl font-bold mb-4">✏️ Editar sección</h2>
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                const f = e.target;
                                const secciones = (estado.billetera.secciones || []).map(s =>
                                    s.id === form.seccionId ? {...s, nombre: f.nombre.value, monto: parseFloat(f.monto.value) || 0, icono: f.icono.value || '💼'} : s
                                );
                                setEstado({...estado, billetera: {...estado.billetera, secciones}});
                                setModal(null);
                            }}>
                                <div className="space-y-3 mb-4">
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">Icono (emoji)</label>
                                        <input type="text" name="icono" defaultValue={form.icono || '💼'} className="w-full px-4 py-3 border-2 rounded-xl text-2xl text-center" maxLength="4" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">Nombre</label>
                                        <input type="text" name="nombre" required defaultValue={form.nombre} className="w-full px-4 py-3 border-2 rounded-xl" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">Monto</label>
                                        <input type="number" name="monto" step="0.01" required defaultValue={form.monto} className="w-full px-4 py-3 border-2 rounded-xl text-2xl" />
                                    </div>
                                </div>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setModal(null)} className="flex-1 bg-gray-200 hover:bg-gray-300 px-6 py-3 rounded-xl font-bold">Cancelar</button>
                                    <button type="submit" className="flex-1 bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-xl font-bold">Guardar</button>
                                </div>
                            </form>
                        </Modal>
                    )}

                    {(modal === 'nuevo' || modal === 'editar') && (
                        <Modal onClose={() => setModal(null)}>
                            <h2 className="text-2xl font-bold mb-4">{modal === 'nuevo' ? '➕ Nuevo gasto fijo' : '✏️ Editar'}</h2>
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                const f = e.target;
                                const datos = {
                                    nombre: f.nombre.value,
                                    monto: parseFloat(f.monto.value),
                                    moneda: f.moneda.value,
                                    periodicidad: f.periodicidad.value,
                                    vencimiento: f.vencimiento.value || '-',
                                    categoria: f.categoria.value,
                                    porcentajeCostoDiario: parseInt(f.porcentaje.value),
                                    color: form.color || null,
                                };
                                if (modal === 'nuevo') {
                                    const maxId = estado.gastosFijos.length > 0 ? Math.max(...estado.gastosFijos.map(g => g.id)) : 0;
                                    setEstado({...estado, gastosFijos: [...estado.gastosFijos, {...datos, id: maxId + 1, diaInicioCiclo: estado.diasAcumulados, montoSueldoAsignado: 0}]});
                                } else {
                                    setEstado({...estado, gastosFijos: estado.gastosFijos.map(g => g.id === form.id ? {...g, ...datos} : g)});
                                    setVista('dashboard');
                                }
                                setModal(null);
                            }}>
                                <div className="space-y-3 mb-4">
                                    <input type="text" name="nombre" defaultValue={form.nombre} required placeholder="Nombre" className="w-full px-4 py-3 border-2 rounded-xl" />
                                    <div className="grid grid-cols-2 gap-3">
                                        <input type="number" step="0.01" name="monto" defaultValue={form.monto} required placeholder="Monto" className="w-full px-4 py-3 border-2 rounded-xl" />
                                        <select name="moneda" defaultValue={form.moneda} className="w-full px-4 py-3 border-2 rounded-xl">
                                            <option value={estado.monedaPrincipal}>{estado.monedaPrincipal}</option>
                                            {(estado.monedasSecundarias || []).map(m => (
                                                <option key={m} value={m}>{m}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <input type="text" name="periodicidad" defaultValue={form.periodicidad} required placeholder="Mensual" className="w-full px-4 py-3 border-2 rounded-xl" />
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">Fecha vencimiento</label>
                                        <input type="date" name="vencimiento" defaultValue={form.vencimiento !== '-' ? form.vencimiento : ''} required className="w-full px-4 py-3 border-2 rounded-xl" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">% Cubierto con propinas</label>
                                        <div className="flex items-center gap-3">
                                            <input type="range" name="porcentaje" min="0" max="100" step="10" defaultValue={form.porcentajeCostoDiario || 100} className="flex-1" onChange={(e) => document.getElementById('porcentajeLabel').textContent = e.target.value + '%'} />
                                            <span id="porcentajeLabel" className={`text-2xl font-bold ${t.accentText} w-16`}>{form.porcentajeCostoDiario || 100}%</span>
                                        </div>
                                        <div className="flex justify-between text-xs text-gray-600 mt-1">
                                            <span>0% = Todo sueldo</span>
                                            <span>100% = Todo propinas</span>
                                        </div>
                                    </div>
                                    <select name="categoria" defaultValue={form.categoria} className="w-full px-4 py-3 border-2 rounded-xl">
                                        <option value="Fijo">Fijo</option>
                                        <option value="No Negociable">No Negociable</option>
                                    </select>
                                    {/* Color personalizado - Solo Premium */}
                                    {estado.isPremium && (
                                        <div>
                                            <label className="block text-gray-700 font-bold mb-2">🎨 Color del gasto</label>
                                            <div className="flex flex-wrap gap-2 mb-2">
                                                {['#EF4444','#F97316','#EAB308','#10B981','#3B82F6','#6366F1','#8B5CF6','#EC4899','#6B7280','#1F2937'].map(c => (
                                                    <button key={c} type="button"
                                                        onClick={() => setForm({...form, color: form.color === c ? null : c})}
                                                        className="w-8 h-8 rounded-full transition-all relative flex items-center justify-center"
                                                        style={{
                                                            backgroundColor: c,
                                                            outline: form.color === c ? `3px solid ${c}` : '3px solid transparent',
                                                            outlineOffset: '2px',
                                                            transform: form.color === c ? 'scale(1.15)' : 'scale(1)',
                                                        }}>
                                                        {form.color === c && <span className="text-white font-bold text-sm leading-none">✓</span>}
                                                    </button>
                                                ))}
                                            </div>
                                            {form.color && (
                                                <div className="flex items-center gap-2">
                                                    <div className="w-5 h-5 rounded-full" style={{backgroundColor: form.color}} />
                                                    <span className="text-sm font-bold" style={{color: form.color}}>{form.color}</span>
                                                    <button type="button" onClick={() => setForm({...form, color: null})}
                                                        className="text-xs text-gray-400 hover:text-gray-600 underline ml-1">Quitar</button>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setModal(null)} className="flex-1 bg-gray-200 hover:bg-gray-300 px-6 py-3 rounded-xl font-bold">Cancelar</button>
                                    <button type="submit" className={`flex-1 ${t.btn} text-white px-6 py-3 rounded-xl font-bold`}>Guardar</button>
                                </div>
                            </form>
                        </Modal>
                    )}
                    {modal === 'confirmarCiclo' && (
                        <Modal onClose={() => setModal(null)}>
                            <h2 className="text-2xl font-bold mb-4">✅ Ciclo Completo</h2>
                            <p className="text-gray-600 mb-4">
                                El ciclo de <strong>{form.gastoNombre}</strong> está completo.
                            </p>
                            <div className="bg-green-100 border-l-4 border-green-500 p-4 mb-6 rounded">
                                <p className="text-green-800 font-bold text-sm mb-1">💵 Propinas: ${Math.round(form.cicloCompleto?.montoAcumuladoPropinas || 0)}</p>
                                <p className="text-green-800 font-bold text-sm mb-1">💰 Sueldo: ${Math.round(form.cicloCompleto?.montoSueldoAsignado || 0)}</p>
                                <p className="text-green-800 font-bold text-lg">Total: ${Math.round(form.cicloCompleto?.montoAcumulado || 0)}</p>
                            </div>
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                const nuevaFecha = e.target.nuevaFecha.value;
                                if (!nuevaFecha) { alert('Debés seleccionar una fecha de vencimiento.'); return; }
                                const fechaHoy = calcularFechaActual().toISOString().split('T')[0];
                                if (nuevaFecha <= fechaHoy) { alert('La fecha de vencimiento debe ser posterior al día de hoy.'); return; }
                                const fechaActual = calcularFechaActual().toISOString().split('T')[0];
                                const maxId = estado.gastosExtras.length > 0 ? Math.max(...estado.gastosExtras.map(g => g.id)) : 0;
                                let nuevoEstado = {...estado};
                                if ((form.cicloCompleto?.montoSueldoAsignado || 0) > 0) {
                                    nuevoEstado.ingresosDiarios = [...estado.ingresosDiarios, {
                                        dia: estado.diasAcumulados,
                                        fecha: fechaActual,
                                        propinas: form.cicloCompleto.montoSueldoAsignado,
                                        usd: 0, ars: 0,
                                        concepto: `Sueldo asignado a ${form.gastoNombre}`
                                    }];
                                }
                                nuevoEstado.gastosFijos = estado.gastosFijos.map(g =>
                                    g.id === form.gastoId
                                        ? {...g, diaInicioCiclo: estado.diasAcumulados, montoSueldoAsignado: 0, vencimiento: nuevaFecha}
                                        : g
                                );
                                const gastoSeleccionado = estado.gastosFijos.find(g => g.id === form.gastoId);
                                let montoTotalMXN = gastoSeleccionado.monto;
                                if (gastoSeleccionado.moneda && gastoSeleccionado.moneda !== (estado.monedaPrincipal || 'MXN')) {
                                    montoTotalMXN = convertirMoneda(gastoSeleccionado.monto, gastoSeleccionado.moneda, estado.monedaPrincipal || 'MXN');
                                }
                                nuevoEstado.gastosExtras = [...(nuevoEstado.gastosExtras || estado.gastosExtras), {
                                    id: maxId + 1,
                                    fecha: fechaActual,
                                    concepto: `${form.gastoNombre} (ciclo completo)`,
                                    monto: Math.round(montoTotalMXN),
                                    categoria: 'Gasto Fijo',
                                    fuente: 'mxn'
                                }];
                                setEstado(nuevoEstado);
                                setModal(null);
                                setVista('dashboard');
                            }}>
                                <div className="mb-6">
                                    <label className="block text-gray-700 font-bold mb-2">📅 Nueva fecha de vencimiento</label>
                                    <input type="date" name="nuevaFecha" required
                                        min={(() => { const m = new Date(calcularFechaActual()); m.setDate(m.getDate() + 1); return m.toISOString().split('T')[0]; })()}
                                        className="w-full px-4 py-3 border-2 rounded-xl focus:border-purple-500 outline-none" />
                                </div>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => {
                                        if (confirm(`¿Estás segura de que querés ELIMINAR "${form.gastoNombre}"?\n\nEsta acción no se puede deshacer.`)) {
                                            setEstado({...estado, gastosFijos: estado.gastosFijos.filter(g => g.id !== form.gastoId)});
                                            setModal(null);
                                            setVista('dashboard');
                                        }
                                    }} className="flex-1 bg-red-500 hover:bg-red-600 text-white px-6 py-3 rounded-xl font-bold">
                                        🗑️ Eliminar Gasto
                                    </button>
                                    <button type="submit"
                                        className="flex-1 bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl font-bold">
                                        ✅ Reiniciar Ciclo
                                    </button>
                                </div>
                            </form>
                        </Modal>
                    )}
                    </>
                    )}
                </div>
            );
        }

        ReactDOM.render(<FinanzasApp />, document.getElementById('app'));
    </script>
    <!-- Registrar Service Worker -->
    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(reg => console.log('✅ Service Worker registrado:', reg.scope))
          .catch(err => console.log('❌ Error al registrar Service Worker:', err));
      });
    }
    </script>
</body>
</html>
