<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas App</title>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#8B5CF6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Finanzas">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; font-size: 1.5rem; color: #6b7280; font-family: sans-serif; }
        /* Dark theme overrides */
        .t-dark { background-color: #0f172a; color: #f8fafc; }
        .t-dark .bg-white { background-color: #1e293b !important; }
        .t-dark .bg-gray-50, .t-dark .bg-slate-50 { background-color: #111827 !important; }
        .t-dark .bg-gray-100 { background-color: #1e293b !important; }
        .t-dark .bg-green-50, .t-dark .bg-yellow-50, .t-dark .bg-orange-50,
        .t-dark .bg-blue-50, .t-dark .bg-red-50, .t-dark .bg-gray-50 { background-color: #1e293b !important; }
        .t-dark .bg-green-50 { background-color: #1e3a2e !important; }
        .t-dark .bg-blue-50 { background-color: #1e2d3d !important; }
        .t-dark .text-gray-800 { color: #f1f5f9 !important; }
        .t-dark .text-gray-700 { color: #e2e8f0 !important; }
        .t-dark .text-gray-600 { color: #cbd5e1 !important; }
        .t-dark .text-gray-500 { color: #94a3b8 !important; }
        .t-dark .border-gray-200 { border-color: #374151 !important; }
        .t-dark .border-t-2 { border-color: #374151 !important; }
        .t-dark .border-2 { border-color: #374151; }
        .t-dark input, .t-dark select, .t-dark textarea { background-color: #1e293b !important; color: #f1f5f9 !important; border-color: #475569 !important; }
        .t-dark .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7) !important; }
        .t-dark .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5) !important; }
        .t-dark .shadow-xl { box-shadow: 0 20px 25px -5px rgba(0,0,0,0.6) !important; }
        .t-dark .bg-gray-200 { background-color: #374151 !important; }
        .t-dark .text-green-800 { color: #34d399 !important; }
        .t-dark .text-green-800 { color: #6ee7b7 !important; }
        .t-dark .text-blue-800 { color: #60a5fa !important; }
        .t-dark .text-blue-800 { color: #93c5fd !important; }
    </style>
</head>
<body>
    <div id="loading">Cargando aplicacion...</div>
    <div id="app"></div>

    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.6/babel.min.js" crossorigin></script>
    <script>
        // Ocultar loading cuando los scripts esten listos
        window.addEventListener('load', function() {
            var loading = document.getElementById('loading');
            if (loading) loading.style.display = 'none';
        });
    </script>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        const Modal = ({ children, onClose }) => (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" onClick={onClose}>
                <div className="bg-white rounded-3xl shadow-2xl max-w-lg w-full p-6 max-h-[90vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
                    {children}
                </div>
            </div>
        );

        function FinanzasApp() {
            // Estado inicial desde localStorage o valores por defecto
            const estadoInicial = () => {
                try {
                    const guardado = localStorage.getItem('finanzasAppData');
                    if (guardado) {
                        const parsed = JSON.parse(guardado);
                        // Migrar tipoCambio (ARS→MXN) al nuevo esquema tipoCambioARS (ARS por 1 USD)
                        if (parsed.tipoCambio !== undefined && parsed.tipoCambioARS === undefined) {
                            parsed.tipoCambioARS = Math.round(parsed.tipoCambioUSD / parsed.tipoCambio);
                            delete parsed.tipoCambio;
                        }
                        // Migrar al nuevo sistema tiposCambio
                        if (!parsed.tiposCambio) {
                            parsed.tiposCambio = {};
                            if (parsed.tipoCambioUSD) {
                                parsed.tiposCambio['USD'] = { direccion: 'USD_TO_MXN', valor: parsed.tipoCambioUSD };
                            }
                            if (parsed.tipoCambioUSD && parsed.tipoCambioARS) {
                                parsed.tiposCambio['ARS'] = { direccion: 'ARS_TO_MXN', valor: parsed.tipoCambioUSD / parsed.tipoCambioARS };
                            }
                        }
                        if (!parsed.monedaPrincipal) parsed.monedaPrincipal = 'MXN';
                        if (!parsed.categoriasExtra) parsed.categoriasExtra = [];
                        if (!parsed.coloresCategorias) parsed.coloresCategorias = {};
                        if (!parsed.categoriasGasto) parsed.categoriasGasto = [
                            { id: 1, emoji: '🍕', nombre: 'Comida', predefinida: true },
                            { id: 2, emoji: '🚗', nombre: 'Transporte', predefinida: true },
                            { id: 3, emoji: '🎬', nombre: 'Entretenimiento', predefinida: true },
                            { id: 4, emoji: '🏠', nombre: 'Hogar', predefinida: true },
                            { id: 5, emoji: '💊', nombre: 'Salud', predefinida: true },
                            { id: 6, emoji: '👕', nombre: 'Compras', predefinida: true },
                            { id: 7, emoji: '💰', nombre: 'Otros', predefinida: true },
                        ];
                        // Mark existing categories as predefined and add Compras if missing
                        if (parsed.categoriasGasto) {
                            const predefinidaNames = ['Comida','Transporte','Entretenimiento','Hogar','Salud','Otros'];
                            parsed.categoriasGasto = parsed.categoriasGasto.map(c =>
                                predefinidaNames.includes(c.nombre) ? {...c, predefinida: true} : c
                            );
                            if (!parsed.categoriasGasto.find(c => c.nombre === 'Compras')) {
                                const maxId = Math.max(...parsed.categoriasGasto.map(c => c.id));
                                parsed.categoriasGasto.push({ id: maxId + 1, emoji: '👕', nombre: 'Compras', predefinida: true });
                            }
                        }
                        if (parsed.isPremium === undefined) parsed.isPremium = false;
                        if (parsed.premiumCode === undefined) parsed.premiumCode = null;
                        if (parsed.premiumActivadoEn === undefined) parsed.premiumActivadoEn = null;
                        if (parsed.premiumEmail === undefined) parsed.premiumEmail = null;
                        if (!parsed.tema) parsed.tema = 'classic';
                        // Onboarding: usuarios con datos existentes lo omiten
                        if (parsed.onboardingCompleto === undefined) {
                            parsed.onboardingCompleto = true;
                            if (!parsed.monedaPrincipal) parsed.monedaPrincipal = 'MXN';
                            if (!parsed.monedasSecundarias) {
                                parsed.monedasSecundarias = [];
                                if (parsed.billetera && parsed.billetera.usd > 0) parsed.monedasSecundarias.push('USD');
                                if (parsed.billetera && parsed.billetera.ars > 0) parsed.monedasSecundarias.push('ARS');
                            }
                            if (!parsed.nombreUsuario) parsed.nombreUsuario = '';
                        }
                        if (!parsed.ahorrosCompletados) parsed.ahorrosCompletados = [];
                        return parsed;
                    }
                } catch(e) {
                    console.error('Error al leer datos guardados:', e);
                }
                // Usuario NUEVO → mostrar onboarding
                return {
                    onboardingCompleto: false,
                    nombreUsuario: '',
                    fechaInicio: new Date().toISOString().split('T')[0],
                    diasAcumulados: 1,
                    monedaPrincipal: 'MXN',
                    monedasSecundarias: [],
                    tiposCambio: {},
                    gastosFijos: [],
                    ingresosDiarios: [],
                    gastosExtras: [],
                    ahorrosCompletados: [],
                    categoriasExtra: [],
                    coloresCategorias: {},
                    categoriasGasto: [
                        { id: 1, emoji: '🍕', nombre: 'Comida', predefinida: true },
                        { id: 2, emoji: '🚗', nombre: 'Transporte', predefinida: true },
                        { id: 3, emoji: '🎬', nombre: 'Entretenimiento', predefinida: true },
                        { id: 4, emoji: '🏠', nombre: 'Hogar', predefinida: true },
                        { id: 5, emoji: '💊', nombre: 'Salud', predefinida: true },
                        { id: 6, emoji: '👕', nombre: 'Compras', predefinida: true },
                        { id: 7, emoji: '💰', nombre: 'Otros', predefinida: true },
                    ],
                    isPremium: false,
                    premiumCode: null,
                    premiumActivadoEn: null,
                    premiumEmail: null,
                    tema: 'classic',
                    idiomaPreferido: 'es-MX',
                    billetera: { mxnFisico: 0, mxnDigital: 0, usd: 0, ars: 0, tanda: 0, monedas: {}, secciones: [] }
                };
            };

            const [estado, setEstado] = useState(estadoInicial);
            const [vista, setVista] = useState('dashboard');
            const [seleccionado, setSeleccionado] = useState(null);
            const [modal, setModal] = useState(null);
            const [codigoError, setCodigoError] = useState('');
            const [form, setForm] = useState({});
            const [reportePeriodo, setReportePeriodo] = useState('mensual');
            const [deferredPrompt, setDeferredPrompt] = useState(null);

            const convertirMoneda = (monto, monedaOrigen, monedaDestino) => {
                if (monedaOrigen === monedaDestino) return monto;
                const tcs = estado.tiposCambio || {};
                const principal = estado.monedaPrincipal || 'MXN';
                const getBase = (tc) => tc.monedaBase || (tc.direccion || '').split('_TO_')[0];
                if (monedaOrigen === principal) {
                    const tc = tcs[monedaDestino];
                    if (!tc) return monto;
                    const valor = parseFloat(tc.valor) || 1;
                    return getBase(tc) === principal ? monto * valor : monto / valor;
                }
                if (monedaDestino === principal) {
                    const tc = tcs[monedaOrigen];
                    if (!tc) return monto;
                    const valor = parseFloat(tc.valor) || 1;
                    return getBase(tc) === monedaOrigen ? monto * valor : monto / valor;
                }
                const viaPrincipal = convertirMoneda(monto, monedaOrigen, principal);
                return convertirMoneda(viaPrincipal, principal, monedaDestino);
            };

            const LIMITES = {
                gastosFijos: estado.isPremium ? 999 : 3,
                secciones: estado.isPremium ? 999 : 2,
                categoriasExtra: estado.isPremium ? 999 : 5,
                historialDias: estado.isPremium ? 9999 : 30
            };

            const TEMAS = {
                classic: {
                    nombre: 'Classic 🎨', libre: true,
                    bg: 'from-gray-50 via-gray-100 to-gray-100',
                    card1: 'from-gray-700 to-gray-800',
                    navActive: 'bg-gray-100 text-gray-700',
                    bannerGrad: 'from-gray-700 to-gray-800',
                    previewGrad: 'from-gray-700 to-gray-800',
                    btn: 'bg-gray-700 hover:bg-gray-800',
                    btnGrad: 'from-gray-700 to-gray-800 hover:from-gray-800 hover:to-gray-900',
                    progressBar: 'from-gray-600 to-gray-700',
                    badge: 'bg-gray-100 text-gray-700',
                    accentText: 'text-gray-700',
                    accentTextDark: 'text-gray-700',
                    cardHover: 'hover:border-gray-400',
                    primary: '#4A5568',
                    secondary: '#718096',
                },
                dark: {
                    nombre: 'Dark 🌙', libre: false,
                    bg: 'from-gray-900 via-gray-800 to-gray-700',
                    card1: 'from-gray-700 to-gray-600',
                    navActive: 'bg-gray-700 text-gray-100',
                    bannerGrad: 'from-gray-700 to-gray-600',
                    previewGrad: 'from-gray-900 to-gray-600',
                    btn: 'bg-gray-600 hover:bg-gray-500',
                    btnGrad: 'from-gray-700 to-gray-600 hover:from-gray-600 hover:to-gray-500',
                    progressBar: 'from-gray-500 to-gray-400',
                    badge: 'bg-gray-600 text-gray-100',
                    accentText: 'text-gray-300',
                    accentTextDark: 'text-gray-200',
                    cardHover: 'hover:border-gray-400',
                    primary: '#374151',
                    secondary: '#1F2937',
                },
                ocean: {
                    nombre: 'Ocean 🌊', libre: false,
                    bg: 'from-slate-900 via-blue-900 to-cyan-900',
                    card1: 'from-blue-500 to-cyan-600',
                    navActive: 'bg-blue-50 text-blue-800',
                    bannerGrad: 'from-blue-600 to-cyan-500',
                    previewGrad: 'from-blue-600 to-cyan-500',
                    btn: 'bg-blue-600 hover:bg-blue-700',
                    btnGrad: 'from-blue-600 to-cyan-500 hover:from-blue-700 hover:to-cyan-600',
                    progressBar: 'from-blue-500 to-cyan-400',
                    badge: 'bg-blue-50 text-blue-800',
                    accentText: 'text-blue-600',
                    accentTextDark: 'text-blue-800',
                    cardHover: 'hover:border-blue-400',
                    primary: '#2563EB',
                    secondary: '#0891B2',
                },
                sunset: {
                    nombre: 'Sunset 🌅', libre: false,
                    bg: 'from-orange-50 via-rose-50 to-pink-50',
                    card1: 'from-orange-500 to-pink-600',
                    navActive: 'bg-orange-100 text-orange-600',
                    bannerGrad: 'from-orange-500 to-pink-500',
                    previewGrad: 'from-orange-500 to-pink-500',
                    btn: 'bg-orange-500 hover:bg-orange-600',
                    btnGrad: 'from-orange-500 to-pink-500 hover:from-orange-600 hover:to-pink-600',
                    progressBar: 'from-orange-500 to-pink-400',
                    badge: 'bg-orange-100 text-orange-700',
                    accentText: 'text-orange-500',
                    accentTextDark: 'text-orange-600',
                    cardHover: 'hover:border-orange-400',
                    primary: '#F97316',
                    secondary: '#EC4899',
                },
                forest: {
                    nombre: 'Forest 🌿', libre: false,
                    bg: 'from-green-50 via-emerald-50 to-teal-50',
                    card1: 'from-emerald-500 to-green-600',
                    navActive: 'bg-emerald-50 text-emerald-700',
                    bannerGrad: 'from-emerald-600 to-green-700',
                    previewGrad: 'from-emerald-600 to-green-700',
                    btn: 'bg-emerald-600 hover:bg-emerald-700',
                    btnGrad: 'from-emerald-600 to-green-600 hover:from-emerald-700 hover:to-green-700',
                    progressBar: 'from-emerald-500 to-green-400',
                    badge: 'bg-emerald-50 text-emerald-700',
                    accentText: 'text-emerald-600',
                    accentTextDark: 'text-emerald-700',
                    cardHover: 'hover:border-emerald-400',
                    primary: '#059669',
                    secondary: '#10B981',
                },
            };
            const t = TEMAS[estado.tema] || TEMAS.classic;

            const MONEDA_CONF = {
                MXN: { emoji: '🇲🇽', grad: 'from-green-400 to-emerald-500 hover:from-green-500 hover:to-emerald-600' },
                USD: { emoji: '💵', grad: 'from-blue-400 to-cyan-500 hover:from-blue-500 hover:to-cyan-600' },
                ARS: { emoji: '🇦🇷', grad: 'from-sky-400 to-blue-500 hover:from-sky-500 hover:to-blue-600' },
                EUR: { emoji: '🇪🇺', grad: 'from-indigo-400 to-violet-500 hover:from-indigo-500 hover:to-violet-600' },
                GBP: { emoji: '🇬🇧', grad: 'from-rose-400 to-pink-500 hover:from-rose-500 hover:to-pink-600' },
                CAD: { emoji: '🍁', grad: 'from-red-400 to-orange-500 hover:from-red-500 hover:to-orange-600' },
                COP: { emoji: '🇨🇴', grad: 'from-yellow-400 to-amber-500 hover:from-yellow-500 hover:to-amber-600' },
                BRL: { emoji: '🇧🇷', grad: 'from-lime-400 to-green-500 hover:from-lime-500 hover:to-green-600' },
                CLP: { emoji: '🇨🇱', grad: 'from-red-500 to-rose-600 hover:from-red-600 hover:to-rose-700' },
            };
            const monedaConf = (code) => MONEDA_CONF[code] || { emoji: '💱', grad: 'from-gray-400 to-slate-500 hover:from-gray-500 hover:to-slate-600' };

            // Guardar en localStorage cada vez que cambia el estado
            useEffect(() => {
                localStorage.setItem('finanzasAppData', JSON.stringify(estado));
            }, [estado]);

            useEffect(() => {
                const handleBeforeInstallPrompt = (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                };
                window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
                return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
            }, []);

            const formatearFecha = (fecha) => {
                if (!fecha || fecha === '-') return '-';
                const f = new Date(fecha);
                return f.toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' });
            };

            const calcularFechaActual = () => {
                const fechaInicio = new Date(estado.fechaInicio);
                const fechaActual = new Date(fechaInicio);
                fechaActual.setDate(fechaInicio.getDate() + estado.diasAcumulados);
                return fechaActual;
            };

            const calcularCiclo = (gasto) => {
                const porcentaje = (gasto.porcentajeCostoDiario !== undefined && gasto.porcentajeCostoDiario !== null)
                    ? gasto.porcentajeCostoDiario
                    : 100;

                const esAhorro = gasto.categoria === 'Ahorro';
                const monedaDelGasto = gasto.moneda || 'MXN';

                if (!gasto.vencimiento || gasto.vencimiento === '-') {
                    let montoDiarioMXN = gasto.monto;
                    if (gasto.moneda === 'ARS') {
                        montoDiarioMXN = convertirMoneda(gasto.monto, gasto.moneda, estado.monedaPrincipal || 'MXN');
                    } else if (gasto.moneda === 'USD') {
                        montoDiarioMXN = convertirMoneda(gasto.monto, 'USD', estado.monedaPrincipal || 'MXN');
                    }
                    const montoDiarioCostoDiario = montoDiarioMXN * (porcentaje / 100);
                    const montoDiarioSueldo = montoDiarioMXN * ((100 - porcentaje) / 100);
                    return {
                        residuo: 0, progreso: 100,
                        montoAcumulado: gasto.monto, montoAcumuladoPropinas: gasto.monto,
                        montoSueldoAsignado: 0, montoDiario: gasto.monto,
                        montoDiarioMXN, montoDiarioCostoDiario, montoDiarioSueldo,
                        porcentajeCostoDiario: porcentaje, diasDelCiclo: 1,
                        fechaInicioCiclo: estado.fechaInicio, fechaVencimiento: '-',
                        monedaOriginal: monedaDelGasto
                    };
                }

                const fechaInicio = new Date(estado.fechaInicio);
                const fechaVenc = new Date(gasto.vencimiento);
                const fechaInicioCiclo = new Date(fechaInicio);
                fechaInicioCiclo.setDate(fechaInicio.getDate() + (gasto.diaInicioCiclo || 0));

                const diasDelCiclo = Math.max(1, Math.floor((fechaVenc - fechaInicioCiclo) / (1000 * 60 * 60 * 24)));
                let residuo = (estado.diasAcumulados - (gasto.diaInicioCiclo || 0)) % diasDelCiclo;
                const cicloCompleto = residuo === 0 && estado.diasAcumulados > (gasto.diaInicioCiclo || 0);
                if (cicloCompleto) residuo = diasDelCiclo;

                const montoDiario = gasto.monto / diasDelCiclo;
                const montoInicialRaw = gasto.montoInicial || 0;

                // AHORROS: solo contar aportes manuales (no todos los ingresos)
                if (esAhorro) {
                    const monedaAhorro = monedaDelGasto;
                    const principal = estado.monedaPrincipal || 'MXN';
                    const fuente = monedaAhorro === principal ? 'mxn' : monedaAhorro.toLowerCase();
                    const aportesAlAhorro = (estado.gastosExtras || [])
                        .filter(g => g.esAporteAhorro && g.ahorroId === gasto.id && g.fuente === fuente)
                        .reduce((sum, g) => sum + g.monto, 0);
                    const montoAcumuladoTotal = montoInicialRaw + aportesAlAhorro;
                    const fechaActual = calcularFechaActual();
                    const diasRestantes = Math.max(0, Math.ceil((fechaVenc - fechaActual) / (1000 * 60 * 60 * 24)));
                    const montoFaltante = Math.max(0, gasto.monto - montoAcumuladoTotal);
                    const diarioRecomendado = diasRestantes > 0 ? montoFaltante / diasRestantes : 0;
                    const diasTranscurridos = Math.max(0, Math.floor((fechaActual - fechaInicioCiclo) / (1000 * 60 * 60 * 24)));
                    const montoEsperado = diasTranscurridos > 0 ? (gasto.monto / diasDelCiclo) * diasTranscurridos : 0;
                    const diferencia = montoAcumuladoTotal - montoEsperado;
                    const estadoAhorro = diferencia > 0 ? 'adelantado' : diferencia < -0.01 ? 'atrasado' : 'al_dia';
                    return {
                        residuo, diasDelCiclo,
                        progreso: (montoAcumuladoTotal / gasto.monto) * 100,
                        montoAcumulado: montoAcumuladoTotal,
                        montoAcumuladoPropinas: aportesAlAhorro,
                        montoSueldoAsignado: 0,
                        montoDiario, montoDiarioMXN: montoDiario,
                        montoDiarioCostoDiario: 0, montoDiarioSueldo: 0,
                        porcentajeCostoDiario: 0,
                        cicloCompleto: montoAcumuladoTotal >= gasto.monto,
                        fechaInicioCiclo: fechaInicioCiclo.toISOString().split('T')[0],
                        fechaVencimiento: gasto.vencimiento,
                        montoInicial: montoInicialRaw, monedaOriginal: monedaDelGasto,
                        diasRestantes, diarioRecomendado,
                        diferencia: Math.abs(diferencia), estadoAhorro
                    };
                }

                // GASTOS FIJOS: convertir todo a MXN
                let montoDiarioMXN = montoDiario;
                if (gasto.moneda === 'ARS') {
                    montoDiarioMXN = convertirMoneda(montoDiario, gasto.moneda, estado.monedaPrincipal || 'MXN');
                } else if (gasto.moneda === 'USD') {
                    montoDiarioMXN = convertirMoneda(montoDiario, 'USD', estado.monedaPrincipal || 'MXN');
                }
                // SIEMPRE usar montosDivididos (auto-migrar si no existe)
                let montosDivididosActual = gasto.montosDivididos;
                if (!montosDivididosActual) {
                    const montoDiariosLegacy = Math.round(montoDiarioMXN * diasDelCiclo * porcentaje / 100);
                    const montoSueldoLegacy = Math.round(montoDiarioMXN * diasDelCiclo * (100 - porcentaje) / 100);
                    montosDivididosActual = { diarios: montoDiariosLegacy, quincenal: 0, mensual: montoSueldoLegacy };
                }
                const totalDiarios = montosDivididosActual.diarios || 0;
                const totalSueldo = (montosDivididosActual.quincenal || 0) + (montosDivididosActual.mensual || 0);
                const montoDiarioCostoDiario = diasDelCiclo > 0 ? Math.ceil((totalDiarios / diasDelCiclo) / 10) * 10 : 0;
                const montoDiarioSueldo = diasDelCiclo > 0 ? Math.ceil((totalSueldo / diasDelCiclo) / 10) * 10 : 0;

                                    MXN: estado.billetera.mxnFisico + (estado.billetera.mxnDigital || 0),

                                    {/* Monedas Secundarias */}
                                    {(estado.monedasSecundarias || []).map(code => {

                                    {/* Ahorros por moneda */}

                                        (estado.ahorrosCompletados || []).filter(a => !a.pagado).forEach(a => {
                                            const moneda = a.moneda || 'MXN';
                                            if (!ahorrosPorMoneda[moneda]) ahorrosPorMoneda[moneda] = { enProgreso: 0, completados: 0 };
                                            ahorrosPorMoneda[moneda].completados += a.monto;

                                            const total = datos.enProgreso + datos.completados;

                                            const esMonedaPrincipal = moneda === principal;

                                ))}
                                </div>

                            })()}
                        </div>
                    </div>

            const VistaIngresos = () => {

                const totalUSD = estado.ingresosDiarios.reduce((sum, ing) => sum + ing.usd, 0);

                                            <button key={code} onClick={() => { setForm({ seccionIngreso: code.toLowerCase() }); setModal('modalIngreso'); }}

                                            <span className="text-3xl mb-2">{seccion.icono || '💼'}</span>
                                            <span className="font-bold text-lg">{seccion.nombre}</span>
                                            <span className="text-xs opacity-80 mt-1">{Math.round(seccion.monto).toLocaleString()} disp.</span>
                                        </button>

                                </div>
                            </div>

                                    const getTotal = (code) => {
                                        if (code === principal) return totalPropinas;
                                        if (code === 'USD') return totalUSD;
                                        if (code === 'ARS') return totalARS;
                                        return estado.ingresosDiarios.reduce((sum, ing) => sum + (ing[code.toLowerCase()] || 0), 0);
                                    };

                                    const cols = monedas.length === 1 ? 'grid-cols-1' : monedas.length === 2 ? 'grid-cols-2' : 'grid-cols-3';

                                        <div className={`grid ${cols} gap-3 mb-6`}>
                                            {monedas.map(code => (
                                                <div key={code} className={`${bgMap[code] || 'bg-gray-100'} rounded-xl p-3`}>

                                                    <p className={`text-2xl font-bold ${tcMap[code] || 'text-gray-700'}`}>{Math.round(getTotal(code)).toLocaleString()}</p>

                                        {[...estado.ingresosDiarios]

                                                const fb = b.fecha ? new Date(b.fecha + 'T12:00:00') : (() => { const f = new Date(estado.fechaInicio); f.setDate(f.getDate() + b.dia); return f; })();
                                                return fb - fa;
                                            })
                                            .map((ingreso, idx) => {
                                            const fechaIngreso = ingreso.fecha
                                                ? new Date(ingreso.fecha + 'T12:00:00')

                return (
                    <div className={`min-h-screen bg-gradient-to-br ${t.bg} p-4 pb-24`}>

                                        className="flex flex-col items-center bg-gradient-to-br from-blue-400 to-blue-300 hover:from-blue-500 hover:to-blue-400 text-white rounded-2xl p-5 shadow-md transition-all">

                                    </button>

                            <div className="bg-white rounded-3xl shadow-2xl p-6">
                                <h2 className="text-xl font-bold text-gray-800 mb-4">📋 Historial de gastos</h2>

                                {(() => {
                                    const principal = estado.monedaPrincipal || 'MXN';
                                    const totalPrincipal = estado.gastosExtras.filter(g => !g.fuente || g.fuente === 'mxn' || g.fuente === principal.toLowerCase()).reduce((sum, g) => sum + g.monto, 0);
                                    const secundariasConGastos = (estado.monedasSecundarias || []).filter(m => estado.gastosExtras.some(g => g.fuente === m.toLowerCase()));
                                    const seccionesConGastos = (estado.billetera.secciones || []).filter(s => estado.gastosExtras.some(g => g.fuente === s.id));
                                    const items = [principal, ...secundariasConGastos, ...seccionesConGastos.map(s => `sec_${s.id}`)];
                                    const cols = items.length === 1 ? 'grid-cols-1' : items.length === 2 ? 'grid-cols-2' : 'grid-cols-3';
                                    return (
                                        <div className={`grid ${cols} gap-3 mb-6`}>
                                            <div className="bg-red-50 rounded-xl p-3">
                                                <p className="text-xs text-gray-600">{monedaConf(principal).emoji} Total {principal}</p>
                                                <p className="text-2xl font-bold text-red-800">${Math.round(totalPrincipal).toLocaleString()}</p>
                                            </div>
                                            {secundariasConGastos.map(moneda => {
                                                const total = estado.gastosExtras.filter(g => g.fuente === moneda.toLowerCase()).reduce((sum, g) => sum + g.monto, 0);

                                                    <div key={moneda} className="bg-red-50 rounded-xl p-3">

                                        {[...estado.gastosExtras].sort((a, b) => new Date(b.fecha || 0) - new Date(a.fecha || 0)).map((gasto) => {
                                            const catGasto = (estado.categoriasGasto || []).find(c => c.id === gasto.categoriaId);

                                            <div key={gasto.id} className="bg-gray-50 rounded-xl p-4 border-2 border-gray-200">
                                                <div className="flex justify-between items-start">
                                                    <div>
                                                        <p className="font-bold text-gray-800">
                                                            {catEmoji && <span className="mr-1">{catEmoji}</span>}
                                                            {catNombre}{gasto.concepto ? ` - ${gasto.concepto}` : ''}
                                                        </p>
                                                        <p className="text-sm text-gray-500">{formatearFecha(gasto.fecha)} · {getNombreFuente(gasto.fuente)}</p>

                                                    <div className="text-right flex items-start gap-2">

                            <div className="bg-white rounded-2xl shadow-lg overflow-hidden">

                                {seccionAbierta === 'apariencia' && (
                                    <div className="p-4 border-t border-gray-200 space-y-4">
                                        <div>
                                            <h3 className="text-lg font-bold mb-3">🎨 Tema</h3>
                                            <div className="grid grid-cols-2 gap-3">
                                                {Object.entries(TEMAS).map(([key, tema]) => (
                                                    <button key={key} type="button"
                                                        onClick={() => {
                                                            if (!tema.libre && !estado.isPremium) {
                                                                alert('Esta función es solo para usuarios Premium. Activa Premium para desbloquear todos los temas.');
                                                                return;
                                                            }
                                                            setEstado({...estado, tema: key});
                                                        }}
                                                        className={`relative p-3 rounded-xl border-2 text-left transition-all ${estado.tema === key ? 'border-gray-500 shadow-lg' : 'border-gray-200 hover:border-gray-300'}`}>
                                                        {!tema.libre && !estado.isPremium && (
                                                            <span className="absolute top-2 right-2 text-base">🔒</span>
                                                        )}
                                                        <div className={`h-5 rounded-lg bg-gradient-to-r ${tema.previewGrad} mb-2`} />
                                                        <p className="font-bold text-sm">{tema.nombre}</p>
                                                        {estado.tema === key && <p className={`text-xs ${t.accentText}`}>✓ Activo</p>}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                        <div>
                                            <h3 className="text-lg font-bold mb-3">💎 Premium</h3>
                                            {estado.isPremium ? (
                                                <div className="bg-green-50 border-2 border-green-200 rounded-xl p-4">
                                                    <p className="font-bold text-green-800 mb-1">⭐ Premium Activo</p>
                                                    {estado.premiumCode && <p className="text-sm text-gray-600">Código: {estado.premiumCode}</p>}
                                                    {estado.premiumEmail && <p className="text-sm text-gray-600">Email: {estado.premiumEmail}</p>}
                                                    {estado.premiumActivadoEn && (
                                                        <p className="text-xs text-gray-500 mt-1">
                                                            Activado el {new Date(estado.premiumActivadoEn).toLocaleDateString('es-MX')}
                                                        </p>
                                                    )}
                                                </div>
                                            ) : (
                                                <div className="bg-gray-50 border-2 border-gray-200 rounded-xl p-4">
                                                    <p className="font-semibold mb-3">Versión: Basic (Gratis)</p>
                                                    <button type="button"
                                                        onClick={() => setModal('activarPremium')}
                                                        className="w-full bg-gradient-to-r from-yellow-400 to-orange-400 hover:from-yellow-500 hover:to-orange-500 text-white px-4 py-3 rounded-xl font-bold">
                                                        🌟 Activar Premium
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* Categorías */}
                            <div className="bg-white rounded-2xl shadow-lg overflow-hidden">
                                <AccordionHeader id="categorias" emoji="📋" titulo="Categorías" />
                                {seccionAbierta === 'categorias' && (
                                    <div className="p-4 border-t border-gray-200 space-y-3">
                                        <div className="flex justify-between items-center">
                                            <h3 className="text-lg font-bold">Categorías de gastos</h3>
                                            <button type="button" onClick={() => { setForm({emoji:'', nombre:''}); setModal('nuevaCategoria'); }}
                                                className="bg-gray-700 hover:bg-gray-800 text-white text-sm px-3 py-2 rounded-xl font-bold">
                                                ➕ Nueva
                                            </button>
                                        </div>
                                        <div className="space-y-2">
                                            {(estado.categoriasGasto || []).map(cat => (
                                                <div key={cat.id} className="flex items-center justify-between bg-gray-50 rounded-xl px-4 py-3 border border-gray-200">
                                                    <span className="font-medium text-gray-800">{cat.emoji} {cat.nombre}</span>
                                                    <div className="flex gap-2 items-center">
                                                        {cat.predefinida ? (
                                                            <span className="text-gray-400 text-sm" title="Categoría predefinida">🔒</span>
                                                        ) : (
                                                            <>
                                                                <button type="button"
                                                                    onClick={() => { setForm({...cat}); setModal('editarCategoria'); }}
                                                                    className="text-blue-600 hover:text-blue-800 text-sm">✏️</button>
                                                                <button type="button"
                                                                    onClick={() => {
                                                                        if ((estado.categoriasGasto || []).filter(c => !c.predefinida).length <= 0 && (estado.categoriasGasto || []).length <= 1) { alert('Debe haber al menos una categoría.'); return; }
                                                                        if (confirm(`¿Eliminar "${cat.nombre}"?`)) {
                                                                            setEstado({...estado, categoriasGasto: estado.categoriasGasto.filter(c => c.id !== cat.id)});
                                                                        }
                                                                    }}
                                                                    className="text-red-600 hover:text-red-800 text-sm">🗑️</button>
                                                            </>
                                                        )}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* Datos */}
                            <div className="bg-white rounded-2xl shadow-lg overflow-hidden">
                                <AccordionHeader id="datos" emoji="💾" titulo="Datos" />
                                {seccionAbierta === 'datos' && (
                                    <div className="p-4 border-t border-gray-200 space-y-3">
                                        <button onClick={handleInstallApp}
                                            className="w-full bg-gradient-to-r from-blue-500 to-cyan-500 hover:from-blue-600 hover:to-cyan-600 text-white p-5 rounded-2xl font-bold text-lg shadow-lg transition-all">
                                            <div className="flex items-center justify-center gap-3">
                                                <span className="text-3xl">📱</span>
                                                <div className="text-left">
                                                    <div>Instalar Aplicación</div>
                                                    <div className="text-xs opacity-90 font-normal">Descarga directa en tu dispositivo</div>
                                                </div>
                                            </div>
                                        </button>
                                        <button onClick={() => {
                                            if (confirm('⚠️ ¿Estás segura? Esto borrará TODOS los datos guardados y empezarás de cero.')) {
                                                localStorage.removeItem('finanzasAppData');
                                                localStorage.removeItem('tutorialCompletado');
                                                window.location.reload();
                                            }
                                        }} type="button" className="w-full bg-red-500 hover:bg-red-600 text-white px-6 py-3 rounded-xl font-bold">
                                            🗑️ Borrar todos los datos
                                        </button>
                                    </div>
                                )}
                            </div>

                        </div>
                    </div>
                );
            };

            // Vista Reporte
            const VistaReporte = () => {
                const [subTab, setSubTab] = useState('gastos');
                const fechaHoy = calcularFechaActual();

                const filtrar = (fechaStr) => {
                    if (!fechaStr) return false;
                    const f = new Date(fechaStr + 'T12:00:00');
                    const diffMs = fechaHoy - f;
                    const dias = diffMs / (1000 * 60 * 60 * 24);
                    if (reportePeriodo === 'diario')  return dias < 1;
                    if (reportePeriodo === 'semanal') return dias < 7;
                    if (reportePeriodo === 'mensual') return dias < 30;
                    if (reportePeriodo === 'anual')   return dias < 365;
                    return true;
                };

                // --- Gastos ---
                const gastosFilt = estado.gastosExtras.filter(g => filtrar(g.fecha));
                const totalGastado = gastosFilt.reduce((s, g) => s + g.monto, 0);
                const porCategoria = gastosFilt.reduce((acc, g) => {
                    const catObj = (estado.categoriasGasto || []).find(c => c.id === g.categoriaId);
                    const cat = catObj ? `${catObj.emoji} ${catObj.nombre}` : (g.emoji ? `${g.emoji} ${g.categoria || 'Otros'}` : (g.categoria || 'Otros'));
                    acc[cat] = (acc[cat] || 0) + g.monto;
                    return acc;
                }, {});
                const getNF = (fuente) => {
                    if (!fuente) return `${monedaConf(estado.monedaPrincipal || 'MXN').emoji} ${estado.monedaPrincipal || 'MXN'}`;
                    if (fuente === 'sueldo') return '💰 Salario';
                    const fCode = fuente.toUpperCase();
                    if (MONEDA_CONF[fCode]) return `${monedaConf(fCode).emoji} ${fCode}`;
                    const s = (estado.billetera.secciones || []).find(s => s.id === parseInt(fuente));
                    return s ? `${s.icono || '💼'} ${s.nombre}` : fuente;
                };
                const porFuente = gastosFilt.reduce((acc, g) => {
                    const f = getNF(g.fuente);
                    acc[f] = (acc[f] || 0) + g.monto;
                    return acc;
                }, {});

                // --- Ingresos ---
                const ingresosFilt = estado.ingresosDiarios.filter(ing => {
                    const fechaStr = ing.fecha || (() => {
                        const f2 = new Date(estado.fechaInicio); f2.setDate(f2.getDate() + ing.dia);
                        return f2.toISOString().split('T')[0];
                    })();
                    return filtrar(fechaStr);
                });
                const totalIngMXN = ingresosFilt.reduce((s, i) => s + (i.propinas || 0), 0);
                const totalIngUSD = ingresosFilt.reduce((s, i) => s + (i.usd || 0), 0);
                const totalIngARS = ingresosFilt.reduce((s, i) => s + (i.ars || 0), 0);
                // Breakdown en MXN equivalente para las barras
                const porMonedaIng = {};
                if (totalIngMXN > 0) porMonedaIng['💵 MXN'] = totalIngMXN;
                if (totalIngUSD > 0) porMonedaIng['💲 USD'] = convertirMoneda(totalIngUSD, 'USD', estado.monedaPrincipal || 'MXN');
                if (totalIngARS > 0) porMonedaIng['🇦🇷 ARS'] = convertirMoneda(totalIngARS, 'ARS', estado.monedaPrincipal || 'MXN');
                const totalIngEquivMXN = Object.values(porMonedaIng).reduce((s, v) => s + v, 0);

                // --- Colores ---
                const PALETTE = ['#f87171','#fb923c','#facc15','#4ade80','#60a5fa','#a78bfa','#f472b6','#22d3ee','#a3e635','#fb7185'];
                const getColor = (cat, idx) => (estado.coloresCategorias || {})[cat] || PALETTE[idx % PALETTE.length];
                const setColor = (cat, color) => setEstado({...estado, coloresCategorias: {...(estado.coloresCategorias || {}), [cat]: color}});

                const ING_COLORS = {'💵 MXN': '#22c55e', '💲 USD': '#3b82f6', '🇦🇷 ARS': '#06b6d4'};
                const labels = {diario: 'Hoy', semanal: 'Últimos 7 días', mensual: 'Últimos 30 días', anual: 'Último año'};

                return (
                    <div className={`min-h-screen bg-gradient-to-br ${t.bg} p-4 pb-24`}>
                        <div className="max-w-2xl mx-auto">

                            {/* Cabecera: período + tabs */}
                            <div className="bg-white rounded-3xl shadow-2xl p-6 mb-4">
                                <h1 className="text-2xl font-bold text-gray-800 mb-4">📊 Reporte</h1>
                                <div className="grid grid-cols-4 gap-2 mb-3">
                                    {['diario','semanal','mensual','anual'].map(p => (
                                        <button key={p} onClick={() => setReportePeriodo(p)}
                                            className={`py-2 rounded-xl text-xs font-bold capitalize ${reportePeriodo === p ? 'bg-gray-700 text-white' : 'bg-gray-100 text-gray-600'}`}>
                                            {p.charAt(0).toUpperCase() + p.slice(1)}
                                        </button>
                                    ))}
                                </div>
                                <p className="text-xs text-gray-400 text-center mb-4">{labels[reportePeriodo]}</p>
                                <div className="grid grid-cols-2 gap-2 mb-4">
                                    <button onClick={() => setSubTab('gastos')}
                                        className={`py-3 rounded-xl font-bold text-sm ${subTab === 'gastos' ? 'bg-red-500 text-white' : 'bg-gray-100 text-gray-600'}`}>
                                        🛒 Gastos
                                    </button>
                                    <button onClick={() => setSubTab('ingresos')}
                                        className={`py-3 rounded-xl font-bold text-sm ${subTab === 'ingresos' ? 'bg-green-500 text-white' : 'bg-gray-100 text-gray-600'}`}>
                                        📥 Ingresos
                                    </button>
                                </div>
                                {subTab === 'gastos' ? (
                                    <div className="bg-red-50 rounded-xl p-4">
                                        <p className="text-xs text-gray-500">Total gastado</p>
                                        <p className="text-2xl font-bold text-red-600">${Math.round(totalGastado).toLocaleString()}</p>
                                        <p className="text-xs text-gray-400">{gastosFilt.length} gastos</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-3 gap-2">
                                        <div className="bg-green-50 rounded-xl p-3 text-center">
                                            <p className="text-xs text-gray-500">💵 MXN</p>
                                            <p className="text-lg font-bold text-green-800">${Math.round(totalIngMXN).toLocaleString()}</p>
                                        </div>
                                        <div className="bg-blue-50 rounded-xl p-3 text-center">
                                            <p className="text-xs text-gray-500">💲 USD</p>
                                            <p className="text-lg font-bold text-blue-800">${Math.round(totalIngUSD)}</p>
                                        </div>
                                        <div className="bg-sky-50 rounded-xl p-3 text-center">
                                            <p className="text-xs text-gray-500">🇦🇷 ARS</p>
                                            <p className="text-lg font-bold text-sky-700">{Math.round(totalIngARS).toLocaleString()}</p>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* === GASTOS === */}
                            {subTab === 'gastos' && (
                                gastosFilt.length === 0 ? (
                                    <div className="bg-white rounded-3xl shadow-2xl p-12 text-center">
                                        <p className="text-5xl mb-3">📭</p>
                                        <p className="text-gray-400">No hay gastos en este período</p>
                                    </div>
                                ) : (
                                    <>
                                        {/* Por categoría con color picker */}
                                        <div className="bg-white rounded-3xl shadow-2xl p-6 mb-4">
                                            <div className="flex justify-between items-center mb-4">
                                                <h2 className="text-base font-bold text-gray-700">🏷️ Por categoría</h2>
                                                <p className="text-xs text-gray-400">Toca el color para cambiarlo</p>
                                            </div>
                                            <div className="space-y-4">
                                                {Object.entries(porCategoria).sort((a,b) => b[1]-a[1]).map(([cat, total], idx) => {
                                                    const pct = totalGastado > 0 ? Math.round((total/totalGastado)*100) : 0;
                                                    const color = getColor(cat, idx);
                                                    return (
                                                        <div key={cat}>
                                                            <div className="flex justify-between items-center mb-1">
                                                                <div className="flex items-center gap-2">
                                                                    <input type="color" value={color}
                                                                        onChange={(e) => setColor(cat, e.target.value)}
                                                                        title="Cambiar color"
                                                                        className="w-7 h-7 rounded-lg cursor-pointer border-2 border-gray-200 p-0.5" />
                                                                    <span className="font-medium text-gray-700 text-sm">{cat}</span>
                                                                </div>
                                                                <span className="font-bold text-sm" style={{color}}>
                                                                    ${Math.round(total).toLocaleString()} <span className="text-gray-400 font-normal">({pct}%)</span>
                                                                </span>
                                                            </div>
                                                            <div className="w-full bg-gray-100 rounded-full h-4 overflow-hidden">
                                                                <div className="h-4 rounded-full transition-all duration-300 flex items-center justify-end pr-2"
                                                                    style={{width:`${Math.max(pct,2)}%`, backgroundColor: color}}>
                                                                    {pct >= 10 && <span className="text-white text-xs font-bold">{pct}%</span>}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>

                                        {/* Por sección de billetera */}
                                        <div className="bg-white rounded-3xl shadow-2xl p-6 mb-4">
                                            <h2 className="text-base font-bold text-gray-700 mb-4">💳 Por sección de billetera</h2>
                                            <div className="space-y-4">
                                                {Object.entries(porFuente).sort((a,b) => b[1]-a[1]).map(([fuente, total]) => {
                                                    const pct = totalGastado > 0 ? Math.round((total/totalGastado)*100) : 0;
                                                    return (
                                                        <div key={fuente}>
                                                            <div className="flex justify-between text-sm mb-1">
                                                                <span className="font-medium text-gray-700">{fuente}</span>
                                                                <span className={`font-bold ${t.accentText}`}>
                                                                    ${Math.round(total).toLocaleString()} <span className="text-gray-400 font-normal">({pct}%)</span>
                                                                </span>
                                                            </div>
                                                            <div className="w-full bg-gray-100 rounded-full h-4 overflow-hidden">
                                                                <div className="h-4 rounded-full flex items-center justify-end pr-2 transition-all duration-300"
                                                                    style={{width:`${Math.max(pct,2)}%`, background:'linear-gradient(to right, #a78bfa, #6366f1)'}}>
                                                                    {pct >= 10 && <span className="text-white text-xs font-bold">{pct}%</span>}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </>
                                )
                            )}

                            {/* === INGRESOS === */}
                            {subTab === 'ingresos' && (
                                ingresosFilt.length === 0 ? (
                                    <div className="bg-white rounded-3xl shadow-2xl p-12 text-center">
                                        <p className="text-5xl mb-3">📭</p>
                                        <p className="text-gray-400">No hay ingresos en este período</p>
                                    </div>
                                ) : (
                                    <>
                                        {/* Por moneda en equivalente MXN */}
                                        {totalIngEquivMXN > 0 && (
                                            <div className="bg-white rounded-3xl shadow-2xl p-6 mb-4">
                                                <h2 className="text-base font-bold text-gray-700 mb-1">💱 Por moneda (equiv. MXN)</h2>
                                                <p className="text-xs text-gray-400 mb-4">Convertido al TC actual</p>
                                                <div className="space-y-4">
                                                    {Object.entries(porMonedaIng).sort((a,b) => b[1]-a[1]).map(([sec, totalMXN]) => {
                                                        const pct = totalIngEquivMXN > 0 ? Math.round((totalMXN/totalIngEquivMXN)*100) : 0;
                                                        const color = ING_COLORS[sec] || '#22c55e';
                                                        return (
                                                            <div key={sec}>
                                                                <div className="flex justify-between text-sm mb-1">
                                                                    <span className="font-medium text-gray-700">{sec}</span>
                                                                    <span className="font-bold" style={{color}}>
                                                                        ${Math.round(totalMXN).toLocaleString()} MXN <span className="text-gray-400 font-normal">({pct}%)</span>
                                                                    </span>
                                                                </div>
                                                                <div className="w-full bg-gray-100 rounded-full h-4 overflow-hidden">
                                                                    <div className="h-4 rounded-full flex items-center justify-end pr-2 transition-all duration-300"
                                                                        style={{width:`${Math.max(pct,2)}%`, backgroundColor: color}}>
                                                                        {pct >= 10 && <span className="text-white text-xs font-bold">{pct}%</span>}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                                <div className="mt-4 bg-green-50 rounded-xl p-3">
                                                    <p className="text-xs text-gray-500">Total en MXN equivalente</p>
                                                    <p className="text-xl font-bold text-green-800">${Math.round(totalIngEquivMXN).toLocaleString()}</p>
                                                </div>
                                            </div>
                                        )}

                                    </>
                                )
                            )}

                        </div>
                    </div>
                );
            };

            // Modal de ingreso unificado (como componente para evitar IIFEs en JSX)
            const ModalIngreso = () => {
                const sec = form.seccionIngreso;
                const principal = estado.monedaPrincipal || 'MXN';
                const secCode = sec ? sec.toUpperCase() : principal;
                const seccionCustom = (estado.billetera.secciones || []).find(s => s.id === sec || s.id === parseInt(sec));
                const cfg = monedaConf(secCode);
                let titulo, placeholder, tcInfo;
                if (secCode === principal || !sec) {
                    titulo = `${cfg.emoji} Ingreso ${principal}`;
                    placeholder = '1500';
                    tcInfo = null;
                } else if (MONEDA_CONF[secCode]) {
                    titulo = `${cfg.emoji} Ingreso en ${secCode}`;
                    placeholder = '0';
                    tcInfo = `TC: 1 ${secCode} = ${convertirMoneda(1, secCode, principal).toFixed(secCode === 'ARS' || secCode === 'CLP' || secCode === 'COP' ? 5 : 2)} ${principal}`;
                } else if (seccionCustom) {
                    titulo = `${seccionCustom.icono || '💼'} Ingreso ${seccionCustom.nombre}`;
                    placeholder = '0';
                    tcInfo = null;
                } else {
                    titulo = `${cfg.emoji} Ingreso ${principal}`;
                    placeholder = '1500';
                    tcInfo = null;
                }
                const handleSubmit = (e) => {
                    e.preventDefault();
                    const monto = parseFloat(e.target.monto.value);
                    const concepto = e.target.concepto.value;
                    const fecha = e.target.fechaIngreso.value || calcularFechaActual().toISOString().split('T')[0];
                    let nuevoIngreso = { dia: estado.diasAcumulados, fecha, propinas: 0, usd: 0, ars: 0, concepto: concepto || titulo };
                    let nuevaBilletera = {...estado.billetera};
                    if (!sec || secCode === principal) {
                        nuevoIngreso.propinas = monto;
                    } else if (secCode === 'USD') {
                        nuevoIngreso.usd = monto;
                        nuevaBilletera.usd = nuevaBilletera.usd + monto;
                    } else if (secCode === 'ARS') {
                        nuevoIngreso.ars = monto;
                        nuevaBilletera.ars = nuevaBilletera.ars + monto;
                    } else if (seccionCustom) {
                        nuevaBilletera.secciones = (nuevaBilletera.secciones || []).map(s =>
                            (s.id === sec || s.id === parseInt(sec)) ? {...s, monto: s.monto + monto} : s
                        );
                    } else if (MONEDA_CONF[secCode]) {
                        nuevaBilletera.monedas = {...(nuevaBilletera.monedas || {}), [secCode]: ((nuevaBilletera.monedas || {})[secCode] || 0) + monto};
                    }
                    setEstado({...estado, billetera: nuevaBilletera, ingresosDiarios: [...estado.ingresosDiarios, nuevoIngreso]});
                    setModal(null);
                };
                return (
                    <Modal onClose={() => setModal(null)}>
                        <h2 className="text-2xl font-bold mb-4">{titulo}</h2>
                        <form onSubmit={handleSubmit}>
                            <input type="number" name="monto" step="0.01" required className="w-full px-4 py-3 border-2 rounded-xl mb-3 text-2xl" placeholder={placeholder} />
                            <input type="text" name="concepto" className="w-full px-4 py-3 border-2 rounded-xl mb-3" placeholder="Concepto (opcional)" />
                            <div className="mb-3">
                                <label className="block text-gray-600 text-sm font-medium mb-1">Fecha del ingreso</label>
                                <input type="date" name="fechaIngreso" defaultValue={new Date().toISOString().split('T')[0]} max={new Date().toISOString().split('T')[0]} className="w-full px-4 py-3 border-2 rounded-xl" />
                            </div>
                            {tcInfo && <p className="text-sm text-gray-600 mb-4">{tcInfo}</p>}
                            {secCode === principal && <p className="text-sm text-gray-600 mb-4">Costo de vida hoy: ${Math.round(costoVidaDiario)}</p>}
                            <div className="flex gap-3">

                        onboardingCompleto: true,
                        nombreUsuario: datos.nombre || '',

                                if (!knownKeys[code]) {

                                    if (v) extras[code] = v;

                                usd: parseFloat(datos.usd) || 0,

                                monedas: extras,
                                secciones: [],

                        premiumCode: null,
                        premiumActivadoEn: null,
                        premiumEmail: null,

                        <div className="flex justify-between text-xs text-gray-500 mb-2">

                                    </div>
                                </div>

                        {/* PASO 4: Información Básica */}

                                </div>
                            </div>

                        {/* PASO 5: Tu Billetera (OBLIGATORIO) */}

                            const currencyKeys = { MXN: 'mxnFisico', USD: 'usd', ARS: 'ars' };
                            const principal = datos.monedaPrincipal || 'MXN';

                                    </div>
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">Tipo de cambio</label>
                                        <input type="number" step="0.000001" name="tipoCambio" required placeholder="17.16" className="w-full px-4 py-3 border-2 rounded-xl" />
                                    </div>
                                </div>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setModal(null)} className="flex-1 bg-gray-200 hover:bg-gray-300 px-6 py-3 rounded-xl font-bold">Cancelar</button>
                                    <button type="submit" className="flex-1 bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-xl font-bold">Agregar</button>
                                </div>
                            </form>
                        </Modal>
                    )}
                    {modal === 'editarMoneda' && (
                        <Modal onClose={() => setModal(null)}>
                            <h2 className="text-2xl font-bold mb-2">✏️ Editar Tipo de Cambio</h2>
                            <p className="text-gray-600 mb-4">Modificá el tipo de cambio de <strong>{form.moneda}</strong></p>
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                const nuevaDireccion = e.target.direccion.value;
                                const nuevoValor = parseFloat(e.target.valor.value);
                                if (!nuevoValor || nuevoValor <= 0) { alert('Ingresá un valor válido.'); return; }
                                const [base, dest] = nuevaDireccion.split('_TO_');
                                setEstado({...estado, tiposCambio: {
                                    ...estado.tiposCambio,
                                    [form.moneda]: { direccion: nuevaDireccion, valor: nuevoValor, monedaBase: base, monedaDestino: dest }
                                }});
                                setModal(null);
                            }}>
                                <div className="space-y-4 mb-6">
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">Dirección del tipo de cambio</label>
                                        <select name="direccion" defaultValue={form.direccion} className="w-full px-4 py-3 border-2 rounded-xl">
                                            <option value={`${estado.monedaPrincipal || 'MXN'}_TO_${form.moneda}`}>1 {estado.monedaPrincipal || 'MXN'} = ___ {form.moneda}</option>
                                            <option value={`${form.moneda}_TO_${estado.monedaPrincipal || 'MXN'}`}>1 {form.moneda} = ___ {estado.monedaPrincipal || 'MXN'}</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">Tipo de cambio</label>
                                        <input type="number" step="0.000001" name="valor" defaultValue={form.valor} required className="w-full px-4 py-3 border-2 rounded-xl" />
                                    </div>
                                </div>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setModal(null)} className="flex-1 bg-gray-200 hover:bg-gray-300 px-6 py-3 rounded-xl font-bold">Cancelar</button>
                                    <button type="submit" className="flex-1 bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-xl font-bold">Guardar</button>
                                </div>
                            </form>
                        </Modal>
                    )}
                    </>
                    )}
                </div>
            );
        }

        ReactDOM.render(<FinanzasApp />, document.getElementById('app'));
    </script>
    <!-- Registrar Service Worker -->
    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(reg => console.log('✅ Service Worker registrado:', reg.scope))
          .catch(err => console.log('❌ Error al registrar Service Worker:', err));
      });
    }
    </script>
</body>
</html>
