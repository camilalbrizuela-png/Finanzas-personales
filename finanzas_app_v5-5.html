                                    <label className="block text-gray-700 font-bold mb-1">💵 USD → MXN</label>
                                    <p className="text-xs text-gray-500 mb-2">¿Cuántos pesos mexicanos vale 1 USD? (ej: 17.16)</p>
                                    <input type="number" step="0.01" value={estado.tipoCambioUSD} onChange={(e) => setEstado({...estado, tipoCambioUSD: parseFloat(e.target.value) || 0})} className="w-full px-4 py-3 border-2 rounded-xl" />
                                </div>
                                <div className="mb-4">
                                    <label className="block text-gray-700 font-bold mb-1">🇦🇷 ARS por 1 USD</label>
                                    <p className="text-xs text-gray-500 mb-2">¿Cuántos pesos argentinos vale 1 USD? (ej: 1430)</p>
                                    <input type="number" step="1" value={estado.tipoCambioARS} onChange={(e) => setEstado({...estado, tipoCambioARS: parseFloat(e.target.value) || 1})} className="w-full px-4 py-3 border-2 rounded-xl" />
                                </div>
                                <div className="bg-blue-50 rounded-xl p-3 mb-6 text-sm text-blue-800">
                                    Conversión: ARS → USD → MXN · 1 ARS = ${(1 / (estado.tipoCambioARS || 1)).toFixed(5)} USD = ${(estado.tipoCambioUSD / (estado.tipoCambioARS || 1)).toFixed(5)} MXN
                                </div>

                                {/* Selector de Temas */}
                                <div className="mb-6">
                                    <h3 className="text-xl font-bold mb-3">🎨 Tema</h3>
                                    <div className="grid grid-cols-2 gap-3">
                                        {Object.entries(TEMAS).map(([key, tema]) => (
                                            <button key={key} type="button"
                                                onClick={() => {
                                                    if (!tema.libre && !estado.isPremium) {
                                                        alert('Esta función es solo para usuarios Premium. Activa Premium para desbloquear todos los temas.');
                                                        return;
                                                    }
                                                    setEstado({...estado, tema: key});
                                                }}
                                                className={`relative p-3 rounded-xl border-2 text-left transition-all ${estado.tema === key ? 'border-purple-500 shadow-lg' : 'border-gray-200 hover:border-purple-300'}`}>
                                                {!tema.libre && !estado.isPremium && (
                                                    <span className="absolute top-2 right-2 text-base">🔒</span>
                                                )}
                                                <div className={`h-5 rounded-lg bg-gradient-to-r ${tema.previewGrad} mb-2`} />
                                                <p className="font-bold text-sm">{tema.nombre}</p>
                                                {estado.tema === key && <p className={`text-xs ${t.accentText}`}>✓ Activo</p>}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="mb-6">
                                    <h3 className="text-xl font-bold mb-3">💎 Premium</h3>
                                    {estado.isPremium ? (
                                        <div className="bg-green-50 border-2 border-green-200 rounded-xl p-4">
                                            <p className="font-bold text-green-800 mb-1">⭐ Premium Activo</p>
                                            {estado.premiumCode && <p className="text-sm text-gray-600">Código: {estado.premiumCode}</p>}
                                            {estado.premiumActivadoEn && (
                                                <p className="text-xs text-gray-500 mt-1">
                                                    Activado el {new Date(estado.premiumActivadoEn).toLocaleDateString('es-MX')}
                                                </p>
                                            )}
                                        </div>
                                    ) : (
                                        <div className="bg-gray-50 border-2 border-gray-200 rounded-xl p-4">
                                            <p className="font-semibold mb-3">Versión: Basic (Gratis)</p>
                                            <button type="button"
                                                onClick={() => {
                                                    if (confirm('¿Activar Premium?\n\nDesbloquea 4 temas exclusivos y futuras funciones premium.\n\n✓ 4 temas de colores exclusivos\n✓ Más funciones próximamente')) {
                                                        setEstado({...estado, isPremium: true, premiumActivadoEn: new Date().toISOString()});
                                                        setModal(null);
                                                    }
                                                }}
                                                className="w-full bg-gradient-to-r from-yellow-400 to-orange-400 hover:from-yellow-500 hover:to-orange-500 text-white px-4 py-3 rounded-xl font-bold mb-2">
                                                🌟 Activar Premium (Gratis por ahora)
                                            </button>
                                            <button type="button"
                                                onClick={() => setModal('activarPremium')}
                                                className="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-xl font-bold text-sm">
                                                Usar código de activación
                                            </button>
                                        </div>
                                    )}
                                </div>

                                <button onClick={() => {
                                    if (confirm('⚠️ ¿Estás segura? Esto borrará TODOS los datos guardados y empezarás de cero.')) {
                                        localStorage.removeItem('finanzasAppData');
                                        localStorage.removeItem('tutorialCompletado');
                                        window.location.reload();
                                    }
                                }} type="button" className="w-full bg-red-500 hover:bg-red-600 text-white px-6 py-3 rounded-xl font-bold mb-3">
                                    🗑️ Borrar todos los datos
                                </button>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setModal(null)} className="flex-1 bg-gray-200 hover:bg-gray-300 px-6 py-3 rounded-xl font-bold">Cancelar</button>
                                    <button type="submit" className={`flex-1 ${t.btn} text-white px-6 py-3 rounded-xl font-bold`}>Guardar</button>
                                </div>
                            </form>
                        </Modal>
                    )}

                    {modal === 'ingresoSueldo' && (
                        <Modal onClose={() => setModal(null)}>
                            <h2 className="text-2xl font-bold mb-1">💰 Ingresar Salario</h2>
                            <p className="text-gray-500 text-sm mb-4">Asigná a gastos fijos y el sobrante va a MXN disponibles</p>

                            <form onSubmit={(e) => {
                                e.preventDefault();
                                const f = e.target;
                                const totalSalario = parseFloat(f.totalSalario.value) || 0;
                                const formData = new FormData(f);

                                let totalAsignado = 0;
                                const nuevosGastos = estado.gastosFijos.map(gasto => {
                                    const montoAsignado = parseFloat(formData.get(`gasto_${gasto.id}`) || 0);
                                    totalAsignado += montoAsignado;
                                    if (montoAsignado > 0) {
                                        return {...gasto, montoSueldoAsignado: (gasto.montoSueldoAsignado || 0) + montoAsignado};
                                    }
                                    return gasto;
                                });

                                const sobrante = totalSalario - totalAsignado;
                                let nuevosIngresos = [...estado.ingresosDiarios];
                                if (sobrante > 0) {
                                    nuevosIngresos.push({
                                        dia: estado.diasAcumulados,
                                        fecha: calcularFechaActual().toISOString().split('T')[0],
                                        propinas: sobrante,
                                        usd: 0,
                                        concepto: 'Sobrante de salario'
                                    });
                                }

                                setEstado({...estado, gastosFijos: nuevosGastos, ingresosDiarios: nuevosIngresos});
                                setModal(null);
                            }}>
                                <div className="mb-4">
                                    <label className="block text-gray-700 font-bold mb-2">Total salario recibido ($)</label>
                                    <input type="number" name="totalSalario" step="0.01" required placeholder="0" className="w-full px-4 py-3 border-2 rounded-xl text-2xl font-bold" />
                                </div>

                                <div className="space-y-3 mb-4 max-h-64 overflow-y-auto">
                                    {estado.gastosFijos.filter(g => calcularCiclo(g).porcentajeCostoDiario < 100).map(gasto => {
                                        const ciclo = calcularCiclo(gasto);
                                        const montoNecesario = Math.round((ciclo.montoDiarioMXN * ciclo.diasDelCiclo) * ((100 - ciclo.porcentajeCostoDiario) / 100));
                                        const yaAsignado = gasto.montoSueldoAsignado || 0;
                                        const falta = Math.max(0, montoNecesario - yaAsignado);
                                        return (
                                            <div key={gasto.id} className="bg-blue-50 rounded-xl p-3 border border-blue-200">
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="font-bold text-gray-800 text-sm">{gasto.nombre}</span>
                                                    <span className="text-xs text-blue-700">{100 - ciclo.porcentajeCostoDiario}% sueldo · necesita ${montoNecesario}</span>
                                                </div>
                                                {yaAsignado > 0 && <p className="text-xs text-green-600 mb-1">✓ Ya asignado: ${Math.round(yaAsignado)}</p>}
                                                <input type="number" name={`gasto_${gasto.id}`} step="0.01" defaultValue={falta} placeholder="0" className="w-full px-3 py-2 border-2 rounded-lg text-base font-bold" />
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="bg-gray-50 rounded-xl p-3 mb-4 text-sm text-gray-600">
                                    El sobrante (salario − asignado a gastos) se enviará automáticamente a MXN disponibles.
                                </div>

                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setModal(null)} className="flex-1 bg-gray-200 hover:bg-gray-300 px-6 py-3 rounded-xl font-bold">Cancelar</button>
                                    <button type="submit" className="flex-1 bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-xl font-bold">Aplicar</button>
                                </div>
                            </form>
                        </Modal>
                    )}

                    {modal === 'ajustarInicio' && (
                        <Modal onClose={() => setModal(null)}>
                            <h2 className="text-2xl font-bold mb-4">🔧 Ajustar día de inicio</h2>
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                const nuevoDia = parseInt(e.target.diaInicio.value);
                                setEstado({...estado, gastosFijos: estado.gastosFijos.map(g => g.id === form.id ? {...g, diaInicioCiclo: nuevoDia} : g)});
                                setSeleccionado({...seleccionado, diaInicioCiclo: nuevoDia});
                                setModal(null);
                            }}>
                                <input type="number" name="diaInicio" defaultValue={form.diaInicioCiclo} required className="w-full px-4 py-3 border-2 rounded-xl mb-4" />
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setModal(null)} className="flex-1 bg-gray-200 hover:bg-gray-300 px-6 py-3 rounded-xl font-bold">Cancelar</button>
                                    <button type="submit" className="flex-1 bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-xl font-bold">Guardar</button>
                                </div>
                            </form>
                        </Modal>
                    )}

                    {modal === 'editarBilletera' && (
                        <Modal onClose={() => setModal(null)}>
                            <h2 className="text-2xl font-bold mb-4">💰 Editar monto</h2>
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                const nuevoValor = parseFloat(e.target.valor.value);
                                setEstado({...estado, billetera: {...estado.billetera, [form.tipo]: nuevoValor}});
                                setModal(null);
                            }}>
                                <input type="number" step="0.01" name="valor" defaultValue={form.valor} required className="w-full px-4 py-3 border-2 rounded-xl text-2xl mb-4" />
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setModal(null)} className="flex-1 bg-gray-200 hover:bg-gray-300 px-6 py-3 rounded-xl font-bold">Cancelar</button>
                                    <button type="submit" className="flex-1 bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-xl font-bold">Guardar</button>
                                </div>
                            </form>
                        </Modal>
                    )}

                    {/* Modal: Nueva Sección Billetera */}
                    {modal === 'nuevaSeccion' && (
                        <Modal onClose={() => setModal(null)}>
                            <h2 className="text-2xl font-bold mb-4">➕ Nueva sección</h2>
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                const f = e.target;
                                const secciones = estado.billetera.secciones || [];
                                const maxId = secciones.length > 0 ? Math.max(...secciones.map(s => s.id)) : 0;
                                const nuevaSeccion = {
                                    id: maxId + 1,
                                    nombre: f.nombre.value,
                                    monto: parseFloat(f.monto.value) || 0,
                                    icono: f.icono.value || '💼'
                                };
                                setEstado({...estado, billetera: {...estado.billetera, secciones: [...secciones, nuevaSeccion]}});
                                setModal(null);
                            }}>
                                <div className="space-y-3 mb-4">
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">Icono (emoji)</label>
                                        <input type="text" name="icono" placeholder="💼" className="w-full px-4 py-3 border-2 rounded-xl text-2xl text-center" maxLength="4" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">Nombre</label>
                                        <input type="text" name="nombre" required placeholder="Ej: Ahorros, Cuenta digital" className="w-full px-4 py-3 border-2 rounded-xl" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">Monto inicial</label>
                                        <input type="number" name="monto" step="0.01" placeholder="0" className="w-full px-4 py-3 border-2 rounded-xl text-2xl" />
                                    </div>
                                </div>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setModal(null)} className="flex-1 bg-gray-200 hover:bg-gray-300 px-6 py-3 rounded-xl font-bold">Cancelar</button>
                                    <button type="submit" className={`flex-1 ${t.btn} text-white px-6 py-3 rounded-xl font-bold`}>Crear</button>
                                </div>
                            </form>
                        </Modal>
                    )}

                    {/* Modal: Editar Sección Billetera */}
                    {modal === 'editarSeccion' && (
                        <Modal onClose={() => setModal(null)}>
                            <h2 className="text-2xl font-bold mb-4">✏️ Editar sección</h2>
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                const f = e.target;
                                const secciones = (estado.billetera.secciones || []).map(s =>
                                    s.id === form.seccionId ? {...s, nombre: f.nombre.value, monto: parseFloat(f.monto.value) || 0, icono: f.icono.value || '💼'} : s
                                );
                                setEstado({...estado, billetera: {...estado.billetera, secciones}});
                                setModal(null);
                            }}>
                                <div className="space-y-3 mb-4">
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">Icono (emoji)</label>
                                        <input type="text" name="icono" defaultValue={form.icono || '💼'} className="w-full px-4 py-3 border-2 rounded-xl text-2xl text-center" maxLength="4" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">Nombre</label>
                                        <input type="text" name="nombre" required defaultValue={form.nombre} className="w-full px-4 py-3 border-2 rounded-xl" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">Monto</label>
                                        <input type="number" name="monto" step="0.01" required defaultValue={form.monto} className="w-full px-4 py-3 border-2 rounded-xl text-2xl" />
                                    </div>
                                </div>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setModal(null)} className="flex-1 bg-gray-200 hover:bg-gray-300 px-6 py-3 rounded-xl font-bold">Cancelar</button>
                                    <button type="submit" className="flex-1 bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-xl font-bold">Guardar</button>
                                </div>
                            </form>
                        </Modal>
                    )}

                    {(modal === 'nuevo' || modal === 'editar') && (
                        <Modal onClose={() => setModal(null)}>
                            <h2 className="text-2xl font-bold mb-4">{modal === 'nuevo' ? '➕ Nuevo gasto fijo' : '✏️ Editar'}</h2>
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                const f = e.target;
                                const datos = {
                                    nombre: f.nombre.value,
                                    monto: parseFloat(f.monto.value),
                                    moneda: f.moneda.value,
                                    periodicidad: f.periodicidad.value,
                                    vencimiento: f.vencimiento.value || '-',
                                    categoria: f.categoria.value,
                                    porcentajeCostoDiario: parseInt(f.porcentaje.value),
                                    color: form.color || null,
                                };
                                if (modal === 'nuevo') {
                                    const maxId = estado.gastosFijos.length > 0 ? Math.max(...estado.gastosFijos.map(g => g.id)) : 0;
                                    setEstado({...estado, gastosFijos: [...estado.gastosFijos, {...datos, id: maxId + 1, diaInicioCiclo: estado.diasAcumulados, montoSueldoAsignado: 0}]});
                                } else {
                                    setEstado({...estado, gastosFijos: estado.gastosFijos.map(g => g.id === form.id ? {...g, ...datos} : g)});
                                    setVista('dashboard');
                                }
                                setModal(null);
                            }}>
                                <div className="space-y-3 mb-4">
                                    <input type="text" name="nombre" defaultValue={form.nombre} required placeholder="Nombre" className="w-full px-4 py-3 border-2 rounded-xl" />
                                    <div className="grid grid-cols-2 gap-3">
                                        <input type="number" step="0.01" name="monto" defaultValue={form.monto} required placeholder="Monto" className="w-full px-4 py-3 border-2 rounded-xl" />
                                        <select name="moneda" defaultValue={form.moneda} className="w-full px-4 py-3 border-2 rounded-xl">
                                            <option value="MXN">MXN</option>
                                            <option value="USD">USD</option>
                                            <option value="ARS">ARS</option>
                                        </select>
                                    </div>
                                    <input type="text" name="periodicidad" defaultValue={form.periodicidad} required placeholder="Mensual" className="w-full px-4 py-3 border-2 rounded-xl" />
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">Fecha vencimiento</label>
                                        <input type="date" name="vencimiento" defaultValue={form.vencimiento !== '-' ? form.vencimiento : ''} required className="w-full px-4 py-3 border-2 rounded-xl" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">% Cubierto con propinas</label>
                                        <div className="flex items-center gap-3">
                                            <input type="range" name="porcentaje" min="0" max="100" step="10" defaultValue={form.porcentajeCostoDiario || 100} className="flex-1" onChange={(e) => document.getElementById('porcentajeLabel').textContent = e.target.value + '%'} />
                                            <span id="porcentajeLabel" className={`text-2xl font-bold ${t.accentText} w-16`}>{form.porcentajeCostoDiario || 100}%</span>
                                        </div>
                                        <div className="flex justify-between text-xs text-gray-600 mt-1">
                                            <span>0% = Todo sueldo</span>
                                            <span>100% = Todo propinas</span>
                                        </div>
                                    </div>
                                    <select name="categoria" defaultValue={form.categoria} className="w-full px-4 py-3 border-2 rounded-xl">
                                        <option value="Fijo">Fijo</option>
                                        <option value="No Negociable">No Negociable</option>
                                    </select>
                                    {/* Color personalizado - Solo Premium */}
                                    {estado.isPremium && (
                                        <div>
                                            <label className="block text-gray-700 font-bold mb-2">🎨 Color del gasto</label>
                                            <div className="flex flex-wrap gap-2 mb-2">
                                                {['#EF4444','#F97316','#EAB308','#10B981','#3B82F6','#6366F1','#8B5CF6','#EC4899','#6B7280','#1F2937'].map(c => (
                                                    <button key={c} type="button"
                                                        onClick={() => setForm({...form, color: form.color === c ? null : c})}
                                                        className="w-8 h-8 rounded-full transition-all"
                                                        style={{
                                                            backgroundColor: c,
                                                            outline: form.color === c ? `3px solid ${c}` : '3px solid transparent',
                                                            outlineOffset: '2px',
                                                            transform: form.color === c ? 'scale(1.15)' : 'scale(1)',
                                                        }} />
                                                ))}
                                            </div>
                                            {form.color && (
                                                <div className="flex items-center gap-2">
                                                    <div className="w-5 h-5 rounded-full" style={{backgroundColor: form.color}} />
                                                    <span className="text-sm font-bold" style={{color: form.color}}>{form.color}</span>
                                                    <button type="button" onClick={() => setForm({...form, color: null})}
                                                        className="text-xs text-gray-400 hover:text-gray-600 underline ml-1">Quitar</button>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setModal(null)} className="flex-1 bg-gray-200 hover:bg-gray-300 px-6 py-3 rounded-xl font-bold">Cancelar</button>
                                    <button type="submit" className={`flex-1 ${t.btn} text-white px-6 py-3 rounded-xl font-bold`}>Guardar</button>
                                </div>
                            </form>
                        </Modal>
                    )}
                    </>
                    )}
                </div>
            );
        }

        ReactDOM.render(<FinanzasApp />, document.getElementById('app'));
    </script>
</body>
</html>
