<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; font-size: 1.5rem; color: #6b7280; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="loading">Cargando aplicacion...</div>
    <div id="app"></div>

    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.6/babel.min.js" crossorigin></script>
    <script>
        // Ocultar loading cuando los scripts esten listos
        window.addEventListener('load', function() {
            var loading = document.getElementById('loading');
            if (loading) loading.style.display = 'none';
        });
    </script>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        function FinanzasApp() {
            // Estado inicial desde localStorage o valores por defecto
            const estadoInicial = () => {
                try {
                    const guardado = localStorage.getItem('finanzasAppData');
                    if (guardado) {
                        const parsed = JSON.parse(guardado);
                        // Migrar tipoCambio (ARS→MXN) al nuevo esquema tipoCambioARS (ARS por 1 USD)
                        if (parsed.tipoCambio !== undefined && parsed.tipoCambioARS === undefined) {
                            parsed.tipoCambioARS = Math.round(parsed.tipoCambioUSD / parsed.tipoCambio);
                            delete parsed.tipoCambio;
                        }
                        if (!parsed.categoriasExtra) parsed.categoriasExtra = [];
                        if (!parsed.coloresCategorias) parsed.coloresCategorias = {};
                        if (parsed.isPremium === undefined) parsed.isPremium = false;
                        if (parsed.premiumCode === undefined) parsed.premiumCode = null;
                        if (parsed.premiumActivadoEn === undefined) parsed.premiumActivadoEn = null;
                        // Onboarding: usuarios con datos existentes lo omiten
                        if (parsed.onboardingCompleto === undefined) {
                            parsed.onboardingCompleto = true;
                            if (!parsed.monedaPrincipal) parsed.monedaPrincipal = 'MXN';
                            if (!parsed.monedasSecundarias) {
                                parsed.monedasSecundarias = [];
                                if (parsed.billetera && parsed.billetera.usd > 0) parsed.monedasSecundarias.push('USD');
                                if (parsed.billetera && parsed.billetera.ars > 0) parsed.monedasSecundarias.push('ARS');
                            }
                            if (!parsed.nombreUsuario) parsed.nombreUsuario = '';
                        }
                        return parsed;
                    }
                } catch(e) {
                    console.error('Error al leer datos guardados:', e);
                }
                // Usuario NUEVO → mostrar onboarding
                return {
                    onboardingCompleto: false,
                    nombreUsuario: '',
                    fechaInicio: new Date().toISOString().split('T')[0],
                    diasAcumulados: 1,
                    monedaPrincipal: 'MXN',
                    monedasSecundarias: [],
                    tipoCambioUSD: 17.16,
                    tipoCambioARS: 1560,
                    gastosFijos: [],
                    ingresosDiarios: [],
                    gastosExtras: [],
                    categoriasExtra: [],
                    coloresCategorias: {},
                    isPremium: false,
                    premiumCode: null,
                    premiumActivadoEn: null,
                    billetera: { mxnFisico: 0, mxnDigital: 0, usd: 0, ars: 0, tanda: 0, secciones: [] }
                };
            };

            const [estado, setEstado] = useState(estadoInicial);
            const [vista, setVista] = useState('dashboard');
            const [seleccionado, setSeleccionado] = useState(null);
            const [modal, setModal] = useState(null);
            const [form, setForm] = useState({});
            const [reportePeriodo, setReportePeriodo] = useState('mensual');

            // TC ARS→MXN auto-calculado: (MXN por USD) / (ARS por USD)
            const tipoCambioMXNARS = estado.tipoCambioUSD / (estado.tipoCambioARS || 1560);

            const LIMITES = {
                gastosFijos: estado.isPremium ? 999 : 3,
                secciones: estado.isPremium ? 999 : 2,
                categoriasExtra: estado.isPremium ? 999 : 5,
                historialDias: estado.isPremium ? 9999 : 30
            };

            // Guardar en localStorage cada vez que cambia el estado
            useEffect(() => {
                localStorage.setItem('finanzasAppData', JSON.stringify(estado));
            }, [estado]);

            const formatearFecha = (fecha) => {
                if (!fecha || fecha === '-') return '-';
                const f = new Date(fecha);
                return f.toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' });
            };

            const calcularFechaActual = () => {
                const fechaInicio = new Date(estado.fechaInicio);
                const fechaActual = new Date(fechaInicio);
                fechaActual.setDate(fechaInicio.getDate() + estado.diasAcumulados);
                return fechaActual;
            };

            const calcularCiclo = (gasto) => {
                const porcentaje = (gasto.porcentajeCostoDiario !== undefined && gasto.porcentajeCostoDiario !== null) 
                    ? gasto.porcentajeCostoDiario 
                    : 100;

                if (!gasto.vencimiento || gasto.vencimiento === '-') {
                    let montoDiarioMXN = gasto.monto;
                    if (gasto.moneda === 'ARS') {
                        montoDiarioMXN = gasto.monto * tipoCambioMXNARS;
                    } else if (gasto.moneda === 'USD') {
                        montoDiarioMXN = gasto.monto * estado.tipoCambioUSD;
                    }
                    
                    const montoDiarioCostoDiario = montoDiarioMXN * (porcentaje / 100);
                    const montoDiarioSueldo = montoDiarioMXN * ((100 - porcentaje) / 100);
                    
                    return { 
                        residuo: 0, 
                        progreso: 100, 
                        montoAcumulado: gasto.monto, 
                        montoAcumuladoPropinas: gasto.monto,
                        montoSueldoAsignado: 0,
                        montoDiario: gasto.monto, 
                        montoDiarioMXN: montoDiarioMXN, 
                        montoDiarioCostoDiario: montoDiarioCostoDiario,
                        montoDiarioSueldo: montoDiarioSueldo,
                        porcentajeCostoDiario: porcentaje, 
                        diasDelCiclo: 1,
                        fechaInicioCiclo: estado.fechaInicio,
                        fechaVencimiento: '-'
                    };
                }
                
                const fechaInicio = new Date(estado.fechaInicio);
                const fechaVenc = new Date(gasto.vencimiento);
                const fechaInicioCiclo = new Date(fechaInicio);
                fechaInicioCiclo.setDate(fechaInicio.getDate() + gasto.diaInicioCiclo);
                
                const diasDelCiclo = Math.max(1, Math.floor((fechaVenc - fechaInicioCiclo) / (1000 * 60 * 60 * 24)));
                const residuo = (estado.diasAcumulados - gasto.diaInicioCiclo) % diasDelCiclo;
                
                const montoDiario = gasto.monto / diasDelCiclo;
                
                let montoDiarioMXN = montoDiario;
                if (gasto.moneda === 'ARS') {
                    montoDiarioMXN = montoDiario * tipoCambioMXNARS;
                } else if (gasto.moneda === 'USD') {
                    montoDiarioMXN = montoDiario * estado.tipoCambioUSD;
                }
                
                const montoDiarioCostoDiario = montoDiarioMXN * (porcentaje / 100);
                const montoDiarioSueldo = montoDiarioMXN * ((100 - porcentaje) / 100);
                
                const montoAcumuladoPropinas = residuo * montoDiarioCostoDiario;
                const montoSueldoAsignado = gasto.montoSueldoAsignado || 0;
                const montoAcumuladoTotal = montoAcumuladoPropinas + montoSueldoAsignado;
                
                const progreso = (montoAcumuladoTotal / (gasto.monto * (montoDiarioMXN / montoDiario))) * 100;
                const cicloCompleto = residuo === 0 && estado.diasAcumulados > gasto.diaInicioCiclo;
                
                return { 
                    residuo, 
                    progreso, 
                    montoAcumulado: montoAcumuladoTotal,
                    montoAcumuladoPropinas,
                    montoSueldoAsignado,
                    montoDiario, 
                    montoDiarioMXN, 
                    montoDiarioCostoDiario, 
                    montoDiarioSueldo, 
                    porcentajeCostoDiario: porcentaje, 
                    cicloCompleto, 
                    diasDelCiclo,
                    fechaInicioCiclo: fechaInicioCiclo.toISOString().split('T')[0],
                    fechaVencimiento: gasto.vencimiento
                };
            };

            const costoVidaDiario = estado.gastosFijos.reduce((total, g) => {
                const ciclo = calcularCiclo(g);
                return total + (ciclo.montoDiarioCostoDiario || 0);
            }, 0);

            // Acumulado esperado del ciclo actual
            const acumuladoEsperado = estado.gastosFijos.reduce((total, g) => {
                const ciclo = calcularCiclo(g);
                // Si el ciclo está completo pero NO confirmado, seguir contando el monto total
                if (ciclo.cicloCompleto) {
                    // Convertir el monto a MXN si es necesario
                    let montoTotalMXN = g.monto;
                    if (g.moneda === 'ARS') {
                        montoTotalMXN = g.monto * tipoCambioMXNARS;
                    } else if (g.moneda === 'USD') {
                        montoTotalMXN = g.monto * estado.tipoCambioUSD;
                    }
                    // Solo contar la parte de propinas del monto total
                    const montoPropinas = montoTotalMXN * (ciclo.porcentajeCostoDiario / 100);
                    return total + montoPropinas;
                }
                // Si el ciclo está en progreso, solo sumar el acumulado de propinas
                return total + (ciclo.montoAcumuladoPropinas || 0);
            }, 0);

            // Total de ingresos en MXN (SOLO propinas, USD no cuenta para disponible)
            const totalIngresosMXN = estado.ingresosDiarios.reduce((total, ing) => {
                return total + ing.propinas; // Solo propinas, SIN USD
            }, 0);

            // Total de gastos extras (solo los que descuentan de MXN)
            const totalGastosExtras = estado.gastosExtras.reduce((total, g) => (!g.fuente || g.fuente === 'mxn') ? total + g.monto : total, 0);

            // DISPONIBLE = Ingresos MXN - Acumulado esperado - Gastos extras (USD NO cuenta)
            const superavit = totalIngresosMXN - acumuladoEsperado - totalGastosExtras;

            const Modal = ({ children, onClose }) => (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" onClick={onClose}>
                    <div className="bg-white rounded-3xl shadow-2xl max-w-lg w-full p-6 max-h-[90vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
                        {children}
                    </div>
                </div>
            );

            const MenuNav = () => (
                <div className="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-gray-200 shadow-lg">
                    <div className="max-w-6xl mx-auto grid grid-cols-6 gap-0 p-1">
                        <button onClick={() => setVista('dashboard')} className={`flex flex-col items-center py-2 rounded-xl ${vista === 'dashboard' ? 'bg-purple-100 text-purple-600' : 'text-gray-600'}`}>
                            <span className="text-lg">🏠</span>
                            <span className="text-xs font-semibold">Inicio</span>
                        </button>
                        <button onClick={() => setVista('billetera')} className={`flex flex-col items-center py-2 rounded-xl ${vista === 'billetera' ? 'bg-purple-100 text-purple-600' : 'text-gray-600'}`}>
                            <span className="text-lg">💰</span>
                            <span className="text-xs font-semibold">Billetera</span>
                        </button>
                        <button onClick={() => setVista('ingresos')} className={`flex flex-col items-center py-2 rounded-xl ${vista === 'ingresos' ? 'bg-purple-100 text-purple-600' : 'text-gray-600'}`}>
                            <span className="text-lg">📥</span>
                            <span className="text-xs font-semibold">Ingresos</span>
                        </button>
                        <button onClick={() => setVista('gastos')} className={`flex flex-col items-center py-2 rounded-xl ${vista === 'gastos' ? 'bg-purple-100 text-purple-600' : 'text-gray-600'}`}>
                            <span className="text-lg">🛒</span>
                            <span className="text-xs font-semibold">Gastos</span>
                        </button>
                        <button onClick={() => setVista('reporte')} className={`flex flex-col items-center py-2 rounded-xl ${vista === 'reporte' ? 'bg-purple-100 text-purple-600' : 'text-gray-600'}`}>
                            <span className="text-lg">📊</span>
                            <span className="text-xs font-semibold">Reporte</span>
                        </button>
                        <button onClick={() => setModal('config')} className="flex flex-col items-center py-2 rounded-xl text-gray-600">
                            <span className="text-lg">⚙️</span>
                            <span className="text-xs font-semibold">Config</span>
                        </button>
                    </div>
                </div>
            );

            // Vista Dashboard
            const Dashboard = () => {
                const fechaActual = calcularFechaActual();
                
                return (
                    <div className="min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 p-4 pb-24">
                        <div className="max-w-6xl mx-auto">
                            <div className="bg-white rounded-3xl shadow-2xl p-6 mb-6">
                                <div className="flex justify-between items-center mb-4">
                                    <div>
                                        <h1 className="text-3xl font-bold text-gray-800">💰 Finanzas App</h1>
                                        <p className="text-gray-600">Día {estado.diasAcumulados} • {formatearFecha(fechaActual.toISOString().split('T')[0])}</p>
                                        <p className="text-xs text-gray-500">Inicio: {formatearFecha(estado.fechaInicio)}</p>
                                    </div>
                                    <button onClick={() => setEstado({...estado, diasAcumulados: estado.diasAcumulados + 1})}
                                        className="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-bold">
                                        ⏭️ Avanzar
                                    </button>
                                </div>
                                            </div>

                            {!estado.isPremium && (
                                <div className="bg-gradient-to-r from-purple-600 to-indigo-600 rounded-2xl p-4 mb-6 text-white cursor-pointer hover:scale-[1.02] transition-all"
                                     onClick={() => { setModal('upgradePremium'); setForm({ razon: 'banner' }); }}>
                                    <div className="flex items-center justify-between">
                                        <div className="flex items-center gap-3">
                                            <span className="text-2xl">💎</span>
                                            <div>
                                                <p className="font-bold">Upgrade a Premium</p>
                                                <p className="text-sm opacity-90">Desbloquea funciones ilimitadas</p>
                                            </div>
                                        </div>
                                        <span className="text-2xl">→</span>
                                    </div>
                                </div>
                            )}

                            <div className="grid md:grid-cols-3 gap-6 mb-6">
                                <div className="bg-gradient-to-br from-purple-500 to-indigo-600 rounded-3xl shadow-xl p-6 text-white">
                                    <p className="text-sm opacity-90 mb-2">Costo de vida diario</p>
                                    <p className="text-4xl font-bold">${Math.round(costoVidaDiario)}</p>
                                    <div className="mt-3 pt-3 border-t border-white border-opacity-30">
                                        <p className="text-xs opacity-75">Acumulado ciclo actual</p>
                                        <p className="text-2xl font-bold">${Math.round(acumuladoEsperado)}</p>
                                    </div>
                                </div>
                                <div className="bg-gradient-to-br from-green-500 to-emerald-600 rounded-3xl shadow-xl p-6 text-white">
                                    <p className="text-sm opacity-90 mb-2">Disponible</p>
                                    <p className="text-4xl font-bold">${Math.round(superavit)}</p>
                                    <p className="text-xs opacity-75 mt-1">En pesos mexicanos</p>
                                </div>
                                <div onClick={() => setVista('billetera')} className="bg-gradient-to-br from-orange-500 to-red-600 rounded-3xl shadow-xl p-6 text-white cursor-pointer hover:scale-105 transition-all">
                                    <p className="text-sm opacity-90 mb-2">Billetera Total</p>
                                    <p className="text-4xl font-bold">${Math.round(superavit + (estado.billetera.usd * estado.tipoCambioUSD) + (estado.billetera.ars * tipoCambioMXNARS) + estado.billetera.tanda)}</p>
                                    <p className="text-xs opacity-75 mt-1">Disponible + USD + ARS + Tanda</p>
                                </div>
                            </div>

                            <div className="bg-white rounded-3xl shadow-2xl p-6">
                                <h2 className="text-2xl font-bold text-gray-800 mb-6">📊 Gastos Fijos</h2>
                                <div className="grid md:grid-cols-2 gap-4">
                                    {estado.gastosFijos.map(gasto => {
                                        const ciclo = calcularCiclo(gasto);
                                        return (
                                            <div key={gasto.id} onClick={() => { setSeleccionado(gasto); setVista('detalle'); }}
                                                className="bg-gradient-to-br from-gray-50 to-gray-100 rounded-2xl p-5 cursor-pointer hover:shadow-lg transition-all border-2 border-gray-200 hover:border-purple-400">
                                                <div className="flex justify-between items-start mb-3">
                                                    <div>
                                                        <h3 className="text-lg font-bold text-gray-800">{gasto.nombre}</h3>
                                                        <p className="text-sm text-gray-600">{gasto.periodicidad}</p>
                                                        <p className="text-xs text-gray-500">📅 {formatearFecha(ciclo.fechaInicioCiclo)} → {formatearFecha(ciclo.fechaVencimiento)}</p>
                                                    </div>
                                                    <div className="flex flex-col gap-1 items-end">
                                                        <span className={`px-3 py-1 rounded-full text-xs font-bold ${gasto.categoria === 'Fijo' ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'}`}>
                                                            {gasto.categoria}
                                                        </span>
                                                        {ciclo.porcentajeCostoDiario < 100 && (
                                                            <span className="px-2 py-1 rounded-full text-xs font-bold bg-orange-100 text-orange-700">
                                                                {ciclo.porcentajeCostoDiario}% 💵 / {100-ciclo.porcentajeCostoDiario}% 💰
                                                            </span>
                                                        )}
                                                    </div>
                                                </div>
                                                {ciclo.cicloCompleto && (
                                                    <div className="bg-green-100 border-l-4 border-green-500 p-3 mb-3 rounded">
                                                        <p className="text-green-800 font-bold text-sm">✅ Completo - ${Math.round(gasto.monto)}</p>
                                                    </div>
                                                )}
                                                <div className="mb-3">
                                                    <div className="flex justify-between text-sm mb-1">
                                                        <span className="text-gray-600">Día {ciclo.residuo}/{ciclo.diasDelCiclo}</span>
                                                        <span className="font-bold text-purple-600">${Math.round(ciclo.montoAcumulado)}</span>
                                                    </div>
                                                    <div className="w-full bg-gray-200 rounded-full h-3 mb-2">
                                                        <div className="bg-gradient-to-r from-purple-500 to-indigo-500 h-3 rounded-full" style={{width: `${Math.min(100, ciclo.progreso)}%`}}></div>
                                                    </div>
                                                    <div className="flex justify-between text-xs text-gray-600">
                                                        <span>💵 Propinas: ${Math.round(ciclo.montoAcumuladoPropinas)}</span>
                                                        {ciclo.porcentajeCostoDiario < 100 && (
                                                            <span>💰 Sueldo: ${Math.round(ciclo.montoSueldoAsignado)}</span>
                                                        )}
                                                    </div>
                                                </div>
                                                <div className="text-sm">
                                                    {ciclo.porcentajeCostoDiario === 100 ? (
                                                        <div className="flex justify-between">
                                                            <span className="text-gray-500">💵 Diario:</span>
                                                            <span className="font-bold text-green-700">${Math.round(ciclo.montoDiarioCostoDiario)}</span>
                                                        </div>
                                                    ) : (
                                                        <div className="space-y-1">
                                                            <div className="flex justify-between">
                                                                <span className="text-gray-500">💵 Propinas:</span>
                                                                <span className="font-bold text-green-700">${Math.round(ciclo.montoDiarioCostoDiario)}/día</span>
                                                            </div>
                                                            <div className="flex justify-between">
                                                                <span className="text-gray-500">💰 Sueldo:</span>
                                                                <span className="font-bold text-blue-700">${Math.round((ciclo.montoDiarioMXN * ciclo.diasDelCiclo) * ((100 - ciclo.porcentajeCostoDiario) / 100))}</span>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            // VistaBilletera
            const VistaBilletera = () => {
                const mxnFisico = superavit;

                return (
                <div className="min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 p-4 pb-24">
                    <div className="max-w-2xl mx-auto">
                        <div className="bg-white rounded-3xl shadow-2xl p-8 mb-6">
                            <div className="flex justify-between items-center mb-6">
                                <h1 className="text-3xl font-bold text-gray-800">💰 Mi Billetera</h1>
                                <button onClick={() => {
                                    if ((estado.billetera.secciones || []).length >= LIMITES.secciones) {
                                        setForm({ razon: 'secciones', actual: (estado.billetera.secciones || []).length, limite: LIMITES.secciones });
                                        setModal('upgradePremium');
                                        return;
                                    }
                                    setForm({nombre: '', monto: '', icono: ''});
                                    setModal('nuevaSeccion');
                                }}
                                    className="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded-xl font-bold text-sm">
                                    ➕ Sección
                                </button>
                            </div>

                            <div className="space-y-4">
                                <div className="bg-gradient-to-br from-green-100 to-emerald-100 rounded-2xl p-6">
                                    <div className="flex justify-between items-center mb-2">
                                        <p className="text-gray-700 font-bold">MXN Disponible</p>
                                    </div>
                                    <p className="text-4xl font-bold text-green-700">${Math.round(mxnFisico)}</p>
                                    <p className="text-xs text-gray-500 mt-2">Calculado automáticamente</p>
                                </div>

                                <div className="bg-gradient-to-br from-blue-100 to-cyan-100 rounded-2xl p-6">
                                    <div className="flex justify-between items-center mb-2">
                                        <p className="text-gray-700 font-bold">USD 💲</p>
                                        <button onClick={() => { setForm({tipo: 'usd', valor: estado.billetera.usd}); setModal('editarBilletera'); }}
                                            className="text-blue-600 hover:text-blue-800">✏️</button>
                                    </div>
                                    <p className="text-4xl font-bold text-blue-700">${Math.round(estado.billetera.usd)}</p>
                                    <p className="text-sm text-gray-600 mt-2">≈ ${Math.round(estado.billetera.usd * estado.tipoCambioUSD)} MXN</p>
                                </div>

                                <div className="bg-gradient-to-br from-purple-100 to-pink-100 rounded-2xl p-6">
                                    <div className="flex justify-between items-center mb-2">
                                        <p className="text-gray-700 font-bold">ARS 🇦🇷</p>
                                        <button onClick={() => { setForm({tipo: 'ars', valor: estado.billetera.ars}); setModal('editarBilletera'); }}
                                            className="text-blue-600 hover:text-blue-800">✏️</button>
                                    </div>
                                    <p className="text-4xl font-bold text-purple-700">{Math.round(estado.billetera.ars).toLocaleString()}</p>
                                    <p className="text-sm text-gray-600 mt-2">≈ ${Math.round(estado.billetera.ars * tipoCambioMXNARS)} MXN</p>
                                </div>

                                            <p className="text-3xl font-bold text-blue-700">{100 - ciclo.porcentajeCostoDiario}%</p>
                                            <p className="text-sm font-bold text-gray-700">${Math.round((ciclo.montoDiarioMXN * ciclo.diasDelCiclo) * ((100 - ciclo.porcentajeCostoDiario) / 100))} MXN</p>
                                            <p className="text-xs text-gray-500 mt-1">Del sueldo de la quincena</p>
                                        </div>
                                    </div>
                                    {ciclo.porcentajeCostoDiario < 100 && (
                                        <div className="bg-blue-100 rounded-lg p-3 text-sm text-blue-800">
                                            💡 <strong>Recordá:</strong> Cuando cobres el sueldo, asigná ${Math.round((ciclo.montoDiarioMXN * ciclo.diasDelCiclo) * ((100 - ciclo.porcentajeCostoDiario) / 100))} MXN usando "💰 Asignar Sueldo"
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            // Vista Reporte
            const VistaReporte = () => {
                const [subTab, setSubTab] = useState('gastos');
                const fechaHoy = calcularFechaActual();

                const filtrar = (fechaStr) => {
                    if (!fechaStr) return false;
                    const f = new Date(fechaStr + 'T12:00:00');
                    const diffMs = fechaHoy - f;
                    const dias = diffMs / (1000 * 60 * 60 * 24);
                    if (reportePeriodo === 'diario')  return dias < 1;
                    if (reportePeriodo === 'semanal') return dias < 7;
                    if (reportePeriodo === 'mensual') return dias < 30;
                    if (reportePeriodo === 'anual')   return dias < 365;
                    return true;
                };

                // --- Gastos ---
                const gastosFilt = estado.gastosExtras.filter(g => filtrar(g.fecha));
                const totalGastado = gastosFilt.reduce((s, g) => s + g.monto, 0);
                const porCategoria = gastosFilt.reduce((acc, g) => {
                    const cat = g.categoria || 'Sin categoría';
                    acc[cat] = (acc[cat] || 0) + g.monto;
                    return acc;
                }, {});
                const getNF = (fuente) => {
                    if (!fuente || fuente === 'mxn') return '💵 MXN';
                    if (fuente === 'usd') return '💲 USD';
                    if (fuente === 'ars') return '🇦🇷 ARS';
                    if (fuente === 'tanda') return '🏆 Tanda';
                    if (fuente === 'sueldo') return '💰 Salario';
                    const s = (estado.billetera.secciones || []).find(s => s.id === parseInt(fuente));
                    return s ? `${s.icono || '💼'} ${s.nombre}` : fuente;
                };
                const porFuente = gastosFilt.reduce((acc, g) => {
                    const f = getNF(g.fuente);
                    acc[f] = (acc[f] || 0) + g.monto;
                    return acc;
                }, {});

                // --- Ingresos ---
                const ingresosFilt = estado.ingresosDiarios.filter(ing => {
                    const fechaStr = ing.fecha || (() => {
                        const f2 = new Date(estado.fechaInicio); f2.setDate(f2.getDate() + ing.dia);
                        return f2.toISOString().split('T')[0];
                    })();
                    return filtrar(fechaStr);
                });
                const totalIngMXN = ingresosFilt.reduce((s, i) => s + (i.propinas || 0), 0);
                const totalIngUSD = ingresosFilt.reduce((s, i) => s + (i.usd || 0), 0);
                const totalIngARS = ingresosFilt.reduce((s, i) => s + (i.ars || 0), 0);
                // Breakdown en MXN equivalente para las barras
                const porMonedaIng = {};
                if (totalIngMXN > 0) porMonedaIng['💵 MXN'] = totalIngMXN;
                if (totalIngUSD > 0) porMonedaIng['💲 USD'] = totalIngUSD * estado.tipoCambioUSD;
                if (totalIngARS > 0) porMonedaIng['🇦🇷 ARS'] = totalIngARS * tipoCambioMXNARS;
                const totalIngEquivMXN = Object.values(porMonedaIng).reduce((s, v) => s + v, 0);

                // --- Colores ---
                const PALETTE = ['#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#8b5cf6','#ec4899','#06b6d4','#84cc16','#f43f5e'];
                const getColor = (cat, idx) => (estado.coloresCategorias || {})[cat] || PALETTE[idx % PALETTE.length];
                const setColor = (cat, color) => setEstado({...estado, coloresCategorias: {...(estado.coloresCategorias || {}), [cat]: color}});

                const ING_COLORS = {'💵 MXN': '#22c55e', '💲 USD': '#3b82f6', '🇦🇷 ARS': '#06b6d4'};
                const labels = {diario: 'Hoy', semanal: 'Últimos 7 días', mensual: 'Últimos 30 días', anual: 'Último año'};

                return (
                    <div className="min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 p-4 pb-24">
                        <div className="max-w-2xl mx-auto">

                            {/* Cabecera: período + tabs */}
                            <div className="bg-white rounded-3xl shadow-2xl p-6 mb-4">
                                <h1 className="text-2xl font-bold text-gray-800 mb-4">📊 Reporte</h1>
                                <div className="grid grid-cols-4 gap-2 mb-3">
                                    {['diario','semanal','mensual','anual'].map(p => (
                                        <button key={p} onClick={() => setReportePeriodo(p)}
                                            className={`py-2 rounded-xl text-xs font-bold capitalize ${reportePeriodo === p ? 'bg-purple-500 text-white' : 'bg-gray-100 text-gray-600'}`}>
                                            {p.charAt(0).toUpperCase() + p.slice(1)}
                                        </button>
                                    ))}
                                </div>
                                <p className="text-xs text-gray-400 text-center mb-4">{labels[reportePeriodo]}</p>
                                <div className="grid grid-cols-2 gap-2 mb-4">
                                    <button onClick={() => setSubTab('gastos')}
                                        className={`py-3 rounded-xl font-bold text-sm ${subTab === 'gastos' ? 'bg-red-500 text-white' : 'bg-gray-100 text-gray-600'}`}>
                                        🛒 Gastos
                                    </button>
                                    <button onClick={() => setSubTab('ingresos')}
                                        className={`py-3 rounded-xl font-bold text-sm ${subTab === 'ingresos' ? 'bg-green-500 text-white' : 'bg-gray-100 text-gray-600'}`}>
                                        📥 Ingresos
                                    </button>
                                </div>
                                {subTab === 'gastos' ? (
                                    <div className="bg-red-50 rounded-xl p-4">
                                        <p className="text-xs text-gray-500">Total gastado</p>
                                        <p className="text-2xl font-bold text-red-600">${Math.round(totalGastado).toLocaleString()}</p>
                                        <p className="text-xs text-gray-400">{gastosFilt.length} gastos</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-3 gap-2">
                                        <div className="bg-green-50 rounded-xl p-3 text-center">
                                            <p className="text-xs text-gray-500">💵 MXN</p>
                                            <p className="text-lg font-bold text-green-700">${Math.round(totalIngMXN).toLocaleString()}</p>
                                        </div>
                                        <div className="bg-blue-50 rounded-xl p-3 text-center">
                                            <p className="text-xs text-gray-500">💲 USD</p>
                                            <p className="text-lg font-bold text-blue-700">${Math.round(totalIngUSD)}</p>
                                        </div>
                                        <div className="bg-sky-50 rounded-xl p-3 text-center">
                                            <p className="text-xs text-gray-500">🇦🇷 ARS</p>
                                            <p className="text-lg font-bold text-sky-700">{Math.round(totalIngARS).toLocaleString()}</p>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* === GASTOS === */}
                            {subTab === 'gastos' && (
                                gastosFilt.length === 0 ? (
                                    <div className="bg-white rounded-3xl shadow-2xl p-12 text-center">
                                        <p className="text-5xl mb-3">📭</p>
                                        <p className="text-gray-400">No hay gastos en este período</p>
                                    </div>
                                ) : (
                                    <>
                                        {/* Por categoría con color picker */}
                                        <div className="bg-white rounded-3xl shadow-2xl p-6 mb-4">
                                            <div className="flex justify-between items-center mb-4">
                                                <h2 className="text-base font-bold text-gray-700">🏷️ Por categoría</h2>
                                                <p className="text-xs text-gray-400">Toca el color para cambiarlo</p>
                                            </div>
                                            <div className="space-y-4">
                                                {Object.entries(porCategoria).sort((a,b) => b[1]-a[1]).map(([cat, total], idx) => {
                                                    const pct = totalGastado > 0 ? Math.round((total/totalGastado)*100) : 0;
                                                    const color = getColor(cat, idx);
                                                    return (
                                                        <div key={cat}>
                                                            <div className="flex justify-between items-center mb-1">
                                                                <div className="flex items-center gap-2">
                                                                    <input type="color" value={color}
                                                                        onChange={(e) => setColor(cat, e.target.value)}
                                                                        title="Cambiar color"
                                                                        className="w-7 h-7 rounded-lg cursor-pointer border-2 border-gray-200 p-0.5" />
                                                                    <span className="font-medium text-gray-700 text-sm">{cat}</span>
                                                                </div>
                                                                <span className="font-bold text-sm" style={{color}}>
                                                                    ${Math.round(total).toLocaleString()} <span className="text-gray-400 font-normal">({pct}%)</span>
                                                                </span>
                                                            </div>
                                                            <div className="w-full bg-gray-100 rounded-full h-4 overflow-hidden">
                                                                <div className="h-4 rounded-full transition-all duration-300 flex items-center justify-end pr-2"
                                                                    style={{width:`${Math.max(pct,2)}%`, backgroundColor: color}}>
                                                                    {pct >= 10 && <span className="text-white text-xs font-bold">{pct}%</span>}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>

                                        {/* Por sección de billetera */}
                                        <div className="bg-white rounded-3xl shadow-2xl p-6 mb-4">
                                            <h2 className="text-base font-bold text-gray-700 mb-4">💳 Por sección de billetera</h2>
                                            <div className="space-y-4">
                                                {Object.entries(porFuente).sort((a,b) => b[1]-a[1]).map(([fuente, total]) => {
                                                    const pct = totalGastado > 0 ? Math.round((total/totalGastado)*100) : 0;
                                                    return (
                                                        <div key={fuente}>
                                                            <div className="flex justify-between text-sm mb-1">
                                                                <span className="font-medium text-gray-700">{fuente}</span>
                                                                <span className="font-bold text-purple-600">
                                                                    ${Math.round(total).toLocaleString()} <span className="text-gray-400 font-normal">({pct}%)</span>
                                                                </span>
                                                            </div>
                                                            <div className="w-full bg-gray-100 rounded-full h-4 overflow-hidden">
                                                                <div className="h-4 rounded-full flex items-center justify-end pr-2 transition-all duration-300"
                                                                    style={{width:`${Math.max(pct,2)}%`, background:'linear-gradient(to right, #a78bfa, #6366f1)'}}>
                                                                    {pct >= 10 && <span className="text-white text-xs font-bold">{pct}%</span>}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </>
                                )
                            )}

                            {/* === INGRESOS === */}
                            {subTab === 'ingresos' && (
                                ingresosFilt.length === 0 ? (
                                    <div className="bg-white rounded-3xl shadow-2xl p-12 text-center">
                                        <p className="text-5xl mb-3">📭</p>
                                        <p className="text-gray-400">No hay ingresos en este período</p>
                                    </div>
                                ) : (
                                    <>
                                        {/* Por moneda en equivalente MXN */}
                                        {totalIngEquivMXN > 0 && (
                                            <div className="bg-white rounded-3xl shadow-2xl p-6 mb-4">
                                                <h2 className="text-base font-bold text-gray-700 mb-1">💱 Por moneda (equiv. MXN)</h2>
                                                <p className="text-xs text-gray-400 mb-4">Convertido al TC actual</p>
                                                <div className="space-y-4">
                                                    {Object.entries(porMonedaIng).sort((a,b) => b[1]-a[1]).map(([sec, totalMXN]) => {
                                                        const pct = totalIngEquivMXN > 0 ? Math.round((totalMXN/totalIngEquivMXN)*100) : 0;
                                                        const color = ING_COLORS[sec] || '#22c55e';
                                                        return (
                                                            <div key={sec}>
                                                                <div className="flex justify-between text-sm mb-1">
                                                                    <span className="font-medium text-gray-700">{sec}</span>
                                                                    <span className="font-bold" style={{color}}>
                                                                        ${Math.round(totalMXN).toLocaleString()} MXN <span className="text-gray-400 font-normal">({pct}%)</span>
                                                                    </span>
                                                                </div>
                                                                <div className="w-full bg-gray-100 rounded-full h-4 overflow-hidden">
                                                                    <div className="h-4 rounded-full flex items-center justify-end pr-2 transition-all duration-300"
                                                                        style={{width:`${Math.max(pct,2)}%`, backgroundColor: color}}>
                                                                        {pct >= 10 && <span className="text-white text-xs font-bold">{pct}%</span>}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                                <div className="mt-4 bg-green-50 rounded-xl p-3">
                                                    <p className="text-xs text-gray-500">Total en MXN equivalente</p>
                                                    <p className="text-xl font-bold text-green-700">${Math.round(totalIngEquivMXN).toLocaleString()}</p>
                                                </div>
                                            </div>
                                        )}

                                        {/* Detalle del período */}
                                        <div className="bg-white rounded-3xl shadow-2xl p-6 mb-4">
                                            <h2 className="text-base font-bold text-gray-700 mb-4">📋 Detalle de ingresos</h2>
                                            <div className="space-y-3 max-h-96 overflow-y-auto">
                                                {[...ingresosFilt].reverse().map((ing, idx) => {
                                                    const fechaIng = ing.fecha
                                                        ? new Date(ing.fecha + 'T12:00:00')
                                                        : (() => { const f2 = new Date(estado.fechaInicio); f2.setDate(f2.getDate() + ing.dia); return f2; })();
                                                    return (
                                                        <div key={idx} className="flex justify-between items-center bg-gray-50 rounded-xl p-3 border border-gray-200">
                                                            <div>
                                                                <p className="font-bold text-gray-800 text-sm">{formatearFecha(fechaIng.toISOString().split('T')[0])}</p>
                                                                {ing.concepto && <p className="text-xs text-gray-500">{ing.concepto}</p>}
                                                            </div>
                                                            <div className="text-right">
                                                                {(ing.propinas || 0) > 0 && <p className="text-green-700 font-bold text-sm">💵 ${Math.round(ing.propinas).toLocaleString()}</p>}
                                                                {(ing.usd || 0) > 0 && <p className="text-blue-700 font-bold text-sm">💲 ${Math.round(ing.usd)}</p>}
                                                                {(ing.ars || 0) > 0 && <p className="text-sky-700 font-bold text-sm">🇦🇷 {Math.round(ing.ars).toLocaleString()}</p>}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </>
                                )
                            )}

                        </div>
                    </div>
                );
            };

            // Modal de ingreso unificado (como componente para evitar IIFEs en JSX)
            const ModalIngreso = () => {
                const sec = form.seccionIngreso;
                const seccionCustom = (estado.billetera.secciones || []).find(s => s.id === sec || s.id === parseInt(sec));
                let titulo, placeholder, tcInfo;
                if (sec === 'usd') {
                    titulo = '💲 Ingreso en USD';
                    placeholder = '100';
                    tcInfo = `TC: $1 USD = ${estado.tipoCambioUSD} MXN`;
                } else if (sec === 'ars') {
                    titulo = '🇦🇷 Ingreso en ARS';
                    placeholder = '50000';
                    tcInfo = `TC: 1 ARS = ${tipoCambioMXNARS.toFixed(5)} MXN`;
                } else if (sec === 'tanda') {
                    titulo = '🏆 Ingreso Tanda';
                    placeholder = '1000';
                    tcInfo = null;
                } else if (seccionCustom) {
                    titulo = `${seccionCustom.icono || '💼'} Ingreso ${seccionCustom.nombre}`;
                    placeholder = '0';
                    tcInfo = null;
                } else {
                    titulo = '💵 Ingreso MXN';
                    placeholder = '1500';
                    tcInfo = null;
                }
                const handleSubmit = (e) => {
                    e.preventDefault();
                    const monto = parseFloat(e.target.monto.value);
                    const concepto = e.target.concepto.value;
                    const fecha = calcularFechaActual().toISOString().split('T')[0];
                    let nuevoIngreso = { dia: estado.diasAcumulados, fecha, propinas: 0, usd: 0, ars: 0, concepto: concepto || titulo };
                    let nuevaBilletera = {...estado.billetera};
                    if (sec === 'mxn') {
                        nuevoIngreso.propinas = monto;
                    } else if (sec === 'usd') {
                        nuevoIngreso.usd = monto;
                        nuevaBilletera.usd = nuevaBilletera.usd + monto;
                    } else if (sec === 'ars') {
                        nuevoIngreso.ars = monto;
                        nuevaBilletera.ars = nuevaBilletera.ars + monto;
                    } else if (sec === 'tanda') {
                        nuevaBilletera.tanda = nuevaBilletera.tanda + monto;
                    } else if (seccionCustom) {
                        nuevaBilletera.secciones = (nuevaBilletera.secciones || []).map(s =>
                            (s.id === sec || s.id === parseInt(sec)) ? {...s, monto: s.monto + monto} : s
                        );
                    }
                    setEstado({...estado, billetera: nuevaBilletera, ingresosDiarios: [...estado.ingresosDiarios, nuevoIngreso]});
                    setModal(null);
                };
                return (
                    <Modal onClose={() => setModal(null)}>
                        <h2 className="text-2xl font-bold mb-4">{titulo}</h2>
                        <form onSubmit={handleSubmit}>
                            <input type="number" name="monto" step="0.01" required className="w-full px-4 py-3 border-2 rounded-xl mb-3 text-2xl" placeholder={placeholder} />
                            <input type="text" name="concepto" className="w-full px-4 py-3 border-2 rounded-xl mb-3" placeholder="Concepto (opcional)" />
                            {tcInfo && <p className="text-sm text-gray-600 mb-4">{tcInfo}</p>}
                            {sec === 'mxn' && <p className="text-sm text-gray-600 mb-4">Costo de vida hoy: ${Math.round(costoVidaDiario)}</p>}
                            <div className="flex gap-3">
                                <button type="button" onClick={() => setModal(null)} className="flex-1 bg-gray-200 hover:bg-gray-300 px-6 py-3 rounded-xl font-bold">Cancelar</button>
                                <button type="submit" className="flex-1 bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-xl font-bold">Registrar</button>
                            </div>
                        </form>
                    </Modal>
                );
            };

            // Wizard de onboarding para nuevos usuarios
            const OnboardingWizard = () => {
                const [paso, setPaso] = useState(1);
                const [datos, setDatos] = useState({
                    nombre: '',
                    fechaInicio: new Date().toISOString().split('T')[0],
                    diasAcumulados: 1,
                    monedaPrincipal: 'MXN',
                    monedasSecundarias: [],
                    tiposCambio: {}
                });

                const MONEDAS = [
                    { codigo: 'MXN', nombre: 'Peso Mexicano', pais: '🇲🇽' },
                    { codigo: 'USD', nombre: 'Dólar Estadounidense', pais: '🇺🇸' },
                    { codigo: 'ARS', nombre: 'Peso Argentino', pais: '🇦🇷' },
                    { codigo: 'EUR', nombre: 'Euro', pais: '🇪🇺' },
                    { codigo: 'COP', nombre: 'Peso Colombiano', pais: '🇨🇴' },
                    { codigo: 'CLP', nombre: 'Peso Chileno', pais: '🇨🇱' },
                    { codigo: 'BRL', nombre: 'Real Brasileño', pais: '🇧🇷' },
                    { codigo: 'PEN', nombre: 'Sol Peruano', pais: '🇵🇪' },
                    { codigo: 'UYU', nombre: 'Peso Uruguayo', pais: '🇺🇾' }
                ];
                const limiteMonedas = estado.isPremium ? 999 : 2;

                const BarraPasos = () => (
                    <div className="flex gap-2 mb-6">
                        {[1,2,3,4].map(n => (
                            <div key={n} className={`flex-1 h-2 rounded-full transition-all ${n <= paso ? 'bg-purple-500' : 'bg-gray-200'}`} />
                        ))}
                    </div>
                );

                const finalizarOnboarding = () => {
                    const tcUSD = datos.tiposCambio['USD'] || 17.16;
                    const tcARSraw = datos.tiposCambio['ARS'] || 0;
                    const nuevoEstado = {
                        onboardingCompleto: true,
                        nombreUsuario: datos.nombre,
                        fechaInicio: datos.fechaInicio,
                        diasAcumulados: datos.diasAcumulados,
                        monedaPrincipal: datos.monedaPrincipal,
                        monedasSecundarias: datos.monedasSecundarias,
                        tipoCambioUSD: tcUSD,
                        tipoCambioARS: (datos.monedasSecundarias.includes('ARS') && tcARSraw > 0)
                            ? Math.round(tcUSD / tcARSraw)
                            : 1560,
                        gastosFijos: [],
                        ingresosDiarios: [],
                        gastosExtras: [],
                        categoriasExtra: [],
                        coloresCategorias: {},
                        billetera: { mxnFisico: 0, mxnDigital: 0, usd: 0, ars: 0, tanda: 0, secciones: [] },
                        isPremium: false,
                        premiumCode: null,
                        premiumActivadoEn: null
                    };
                    setEstado(nuevoEstado);
                };

                const bg = "min-h-screen bg-gradient-to-br from-purple-500 to-indigo-600 flex items-center justify-center p-4";
                const card = "bg-white rounded-3xl shadow-2xl max-w-lg w-full p-8";
                const cardWide = "bg-white rounded-3xl shadow-2xl max-w-2xl w-full p-8";

                return (
                    <div>
                        {/* PASO 1: Bienvenida */}
                        {paso === 1 && (
                            <div className={bg}>
                                <div className={`${card} text-center`}>
                                    <BarraPasos />
                                    <div className="text-6xl mb-6">💰</div>
                                    <h1 className="text-4xl font-bold text-gray-800 mb-4">¡Bienvenido a Finanzas App!</h1>
                                    <p className="text-gray-600 mb-8">
                                        Vamos a configurar tu app en 4 pasos rápidos para que empieces a gestionar tus finanzas de manera inteligente.
                                    </p>
                                    <div className="mb-6 text-left">
                                        <label className="block text-gray-700 font-bold mb-2">¿Cómo te llamas? (opcional)</label>
                                        <input type="text" value={datos.nombre}
                                            onChange={(e) => setDatos({...datos, nombre: e.target.value})}
                                            placeholder="Tu nombre"
                                            className="w-full px-4 py-3 border-2 rounded-xl focus:border-purple-500 outline-none" />
                                    </div>
                                    <button onClick={() => setPaso(2)}
                                        className="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white px-6 py-4 rounded-xl font-bold text-lg">
                                        Empezar →
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* PASO 2: Fecha y día actual */}
                        {paso === 2 && (
                            <div className={bg}>

                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">Monto inicial</label>
                                        <input type="number" name="monto" step="0.01" placeholder="0" className="w-full px-4 py-3 border-2 rounded-xl text-2xl" />
                                    </div>
                                </div>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setModal(null)} className="flex-1 bg-gray-200 hover:bg-gray-300 px-6 py-3 rounded-xl font-bold">Cancelar</button>
                                    <button type="submit" className="flex-1 bg-purple-500 hover:bg-purple-600 text-white px-6 py-3 rounded-xl font-bold">Crear</button>
                                </div>
                            </form>
                        </Modal>
                    )}

                    {/* Modal: Editar Sección Billetera */}
                    {modal === 'editarSeccion' && (
                        <Modal onClose={() => setModal(null)}>
                            <h2 className="text-2xl font-bold mb-4">✏️ Editar sección</h2>
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                const f = e.target;
                                const secciones = (estado.billetera.secciones || []).map(s =>
                                    s.id === form.seccionId ? {...s, nombre: f.nombre.value, monto: parseFloat(f.monto.value) || 0, icono: f.icono.value || '💼'} : s
                                );
                                setEstado({...estado, billetera: {...estado.billetera, secciones}});
                                setModal(null);
                            }}>
                                <div className="space-y-3 mb-4">
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">Icono (emoji)</label>
                                        <input type="text" name="icono" defaultValue={form.icono || '💼'} className="w-full px-4 py-3 border-2 rounded-xl text-2xl text-center" maxLength="4" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">Nombre</label>
                                        <input type="text" name="nombre" required defaultValue={form.nombre} className="w-full px-4 py-3 border-2 rounded-xl" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">Monto</label>
                                        <input type="number" name="monto" step="0.01" required defaultValue={form.monto} className="w-full px-4 py-3 border-2 rounded-xl text-2xl" />
                                    </div>
                                </div>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setModal(null)} className="flex-1 bg-gray-200 hover:bg-gray-300 px-6 py-3 rounded-xl font-bold">Cancelar</button>
                                    <button type="submit" className="flex-1 bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-xl font-bold">Guardar</button>
                                </div>
                            </form>
                        </Modal>
                    )}

                    {(modal === 'nuevo' || modal === 'editar') && (
                        <Modal onClose={() => setModal(null)}>
                            <h2 className="text-2xl font-bold mb-4">{modal === 'nuevo' ? '➕ Nuevo gasto fijo' : '✏️ Editar'}</h2>
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                const f = e.target;
                                const datos = {
                                    nombre: f.nombre.value,
                                    monto: parseFloat(f.monto.value),
                                    moneda: f.moneda.value,
                                    periodicidad: f.periodicidad.value,
                                    vencimiento: f.vencimiento.value || '-',
                                    categoria: f.categoria.value,
                                    porcentajeCostoDiario: parseInt(f.porcentaje.value)
                                };
                                if (modal === 'nuevo') {
                                    const maxId = estado.gastosFijos.length > 0 ? Math.max(...estado.gastosFijos.map(g => g.id)) : 0;
                                    setEstado({...estado, gastosFijos: [...estado.gastosFijos, {...datos, id: maxId + 1, diaInicioCiclo: estado.diasAcumulados, montoSueldoAsignado: 0}]});
                                } else {
                                    setEstado({...estado, gastosFijos: estado.gastosFijos.map(g => g.id === form.id ? {...g, ...datos} : g)});
                                    setVista('dashboard');
                                }
                                setModal(null);
                            }}>
                                <div className="space-y-3 mb-4">
                                    <input type="text" name="nombre" defaultValue={form.nombre} required placeholder="Nombre" className="w-full px-4 py-3 border-2 rounded-xl" />
                                    <div className="grid grid-cols-2 gap-3">
                                        <input type="number" step="0.01" name="monto" defaultValue={form.monto} required placeholder="Monto" className="w-full px-4 py-3 border-2 rounded-xl" />
                                        <select name="moneda" defaultValue={form.moneda} className="w-full px-4 py-3 border-2 rounded-xl">
                                            <option value="MXN">MXN</option>
                                            <option value="USD">USD</option>
                                            <option value="ARS">ARS</option>
                                        </select>
                                    </div>
                                    <input type="text" name="periodicidad" defaultValue={form.periodicidad} required placeholder="Mensual" className="w-full px-4 py-3 border-2 rounded-xl" />
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">Fecha vencimiento</label>
                                        <input type="date" name="vencimiento" defaultValue={form.vencimiento !== '-' ? form.vencimiento : ''} required className="w-full px-4 py-3 border-2 rounded-xl" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">% Cubierto con propinas</label>
                                        <div className="flex items-center gap-3">
                                            <input type="range" name="porcentaje" min="0" max="100" step="10" defaultValue={form.porcentajeCostoDiario || 100} className="flex-1" onChange={(e) => document.getElementById('porcentajeLabel').textContent = e.target.value + '%'} />
                                            <span id="porcentajeLabel" className="text-2xl font-bold text-purple-600 w-16">{form.porcentajeCostoDiario || 100}%</span>
                                        </div>
                                        <div className="flex justify-between text-xs text-gray-600 mt-1">
                                            <span>0% = Todo sueldo</span>
                                            <span>100% = Todo propinas</span>
                                        </div>
                                    </div>
                                    <select name="categoria" defaultValue={form.categoria} className="w-full px-4 py-3 border-2 rounded-xl">
                                        <option value="Fijo">Fijo</option>
                                        <option value="No Negociable">No Negociable</option>
                                    </select>
                                </div>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setModal(null)} className="flex-1 bg-gray-200 hover:bg-gray-300 px-6 py-3 rounded-xl font-bold">Cancelar</button>
                                    <button type="submit" className="flex-1 bg-purple-500 hover:bg-purple-600 text-white px-6 py-3 rounded-xl font-bold">Guardar</button>
                                </div>
                            </form>
                        </Modal>
                    )}
                    </>
                    )}
                </>
            );
        }

        ReactDOM.render(<FinanzasApp />, document.getElementById('app'));
    </script>
</body>
</html>
